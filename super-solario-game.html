<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Super Solario Bros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="leaderboard.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#f0b429;--amber:#ff8a00;--ink:#05050c;--panel:#0c0c18;
  --mint:#19f5a0;--danger:#ff3b5c;--muted:#8b879c;
}
html,body{width:100%;height:100%;background:var(--ink);overflow:hidden;touch-action:none;font-family:'Space Grotesk',sans-serif;color:#fff}
#shell{display:flex;flex-direction:column;width:100%;height:100vh;max-width:960px;margin:0 auto;background:radial-gradient(ellipse at 50% 0%,#1a1430 0%,var(--ink) 60%)}
#hud{
  display:grid;grid-template-columns:repeat(5,1fr);gap:6px;
  padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));
  border-bottom:2px solid var(--gold);
  background:linear-gradient(90deg,#080812,#16102a,#080812);
  font-family:'Press Start 2P',monospace;flex-shrink:0;
}
#hud.flash .hv{color:var(--mint);transition:color .15s}
.hb{display:flex;flex-direction:column;gap:3px;min-width:0}
.hl{font-size:6px;color:var(--muted);letter-spacing:1px}
.hv{font-size:clamp(8px,1.5vw,11px);color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage{position:relative;flex:1;overflow:hidden;border-left:2px solid rgba(240,180,41,.35);border-right:2px solid rgba(240,180,41,.35)}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
#overlay{
  position:absolute;inset:0;z-index:5;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:24px;text-align:center;
  background:radial-gradient(ellipse at 50% 30%,rgba(30,20,60,.97),rgba(5,5,12,.98));
  font-family:'Press Start 2P',monospace;
}
#overlay.hidden{display:none}
.logo{
  font-size:clamp(18px,5vw,36px);line-height:1.45;
  background:linear-gradient(135deg,#ffe6a0,var(--gold),var(--amber));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 20px rgba(240,180,41,.4));
}
.sub{font-size:clamp(7px,1.6vw,9px);color:var(--gold);letter-spacing:2px}
.blurb{font-size:clamp(6px,1.4vw,8px);color:#aaa;line-height:2;max-width:420px}
.blurb b{color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
input#uname{
  font-family:'Press Start 2P',monospace;font-size:10px;
  padding:12px 14px;border:2px solid var(--gold);background:#0a0a14;color:var(--gold);
  width:min(260px,80vw);text-align:center;outline:none;letter-spacing:1px;
}
input#uname:focus{box-shadow:0 0 0 3px rgba(240,180,41,.25)}
.btn{
  font-family:'Press Start 2P',monospace;font-size:clamp(8px,2vw,11px);
  padding:14px 22px;border:none;cursor:pointer;letter-spacing:1px;
  background:linear-gradient(135deg,var(--gold),var(--amber));color:#111;
  box-shadow:0 4px 0 #7a3d00,0 0 24px rgba(240,180,41,.35);
}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #7a3d00,0 0 32px rgba(240,180,41,.5)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #7a3d00}
.btn.ghost{background:transparent;color:var(--gold);border:2px solid var(--gold);box-shadow:none}
.hint{font-size:6px;color:#666;letter-spacing:1px}
.best{font-size:7px;color:var(--mint);letter-spacing:1px;margin-top:2px}
#progress{
  position:absolute;left:10px;right:10px;bottom:10px;height:4px;z-index:4;
  background:rgba(255,255,255,.08);border:1px solid rgba(240,180,41,.25);
  pointer-events:none;opacity:0;transition:opacity .2s;
}
#progress.show{opacity:1}
#progress > i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--mint));transition:width .08s linear}
#toast{
  position:absolute;top:12%;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.92);border:2px solid var(--gold);color:var(--gold);
  font-family:'Press Start 2P',monospace;font-size:7px;padding:8px 14px;
  opacity:0;transition:opacity .2s;pointer-events:none;z-index:8;white-space:nowrap;
  max-width:90%;overflow:hidden;text-overflow:ellipsis;
}
#mobile{
  display:none;justify-content:space-between;align-items:center;
  padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));
  border-top:2px solid var(--gold);
  background:linear-gradient(90deg,#080812,#16102a);
}
.pad{display:flex;gap:10px;align-items:center}
.k{
  width:58px;height:58px;border:2px solid var(--gold);border-radius:10px;
  background:rgba(240,180,41,.1);color:var(--gold);font-size:20px;
  display:flex;align-items:center;justify-content:center;user-select:none;
  box-shadow:0 3px 0 #7a6000;font-family:'Press Start 2P',monospace;touch-action:none;
}
.k.on,.k:active{transform:translateY(2px);box-shadow:0 1px 0 #7a6000;background:rgba(240,180,41,.35)}
.kj{width:70px;height:70px;border-radius:50%;border-color:var(--amber);color:var(--amber);font-size:9px;background:rgba(255,138,0,.15)}
.ks{width:48px;height:48px;font-size:8px;border-radius:8px}
#scan{pointer-events:none;position:absolute;inset:0;z-index:3;
  background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(0,0,0,.045) 3px 4px);opacity:.7}
@media(max-width:820px),(pointer:coarse){#mobile{display:flex}}
@media(max-height:500px){.k{width:44px;height:44px}.kj{width:54px;height:54px}.ks{width:40px;height:40px}}
@media(prefers-reduced-motion:reduce){#scan{display:none}#hud.flash .hv{transition:none}}
</style>
</head>
<body>
<div id="shell">
  <div id="hud">
    <div class="hb"><span class="hl">PLAYER</span><span class="hv" id="hName">---</span></div>
    <div class="hb"><span class="hl">$SCORE</span><span class="hv" id="hScore">0</span></div>
    <div class="hb"><span class="hl">LIVES</span><span class="hv" id="hLives">🌙🌙🌙</span></div>
    <div class="hb"><span class="hl">LEVEL</span><span class="hv" id="hLevel">1</span></div>
    <div class="hb"><span class="hl">COINS</span><span class="hv" id="hCoins">0</span></div>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="scan" aria-hidden="true"></div>
    <div id="progress" aria-hidden="true"><i id="progFill"></i></div>
    <div id="toast"></div>
    <div id="overlay">
      <div class="logo">SUPER<br>SOLARIO</div>
      <div class="sub">ON-CHAIN PLATFORMER</div>
      <div class="blurb">Enter a wallet alias, then stomp bears &amp; stack <b>$SOLARIO</b>.<br>Top scores hit the live leaderboard.</div>
      <div class="best" id="bestLine"></div>
      <input id="uname" maxlength="12" placeholder="USERNAME" autocomplete="off" spellcheck="false">
      <div class="row">
        <button class="btn" id="btnStart">LAUNCH</button>
      </div>
      <div class="hint">← → MOVE · SPACE JUMP · P PAUSE · M MUTE</div>
    </div>
  </div>
  <div id="mobile">
    <div class="pad">
      <div class="k" id="btnL">◀</div>
      <div class="k" id="btnR">▶</div>
    </div>
    <div class="pad">
      <div class="k ks" id="btnMute" title="Mute">SND</div>
      <div class="k ks" id="btnPause" title="Pause">II</div>
      <div class="k kj" id="btnJ">JUMP</div>
    </div>
  </div>
</div>
<script>
(() => {
'use strict';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
const stage = document.getElementById('stage');
const overlay = document.getElementById('overlay');
const toastEl = document.getElementById('toast');
const unameIn = document.getElementById('uname');
const progEl = document.getElementById('progress');
const progFill = document.getElementById('progFill');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const T = 32;
const GRAV = 0.55;
const MAX_FALL = 14;
const W = () => canvas.width;
const H = () => canvas.height;
const MUTE_KEY = 'solario_muted';

let username = (window.SolarioLB && SolarioLB.getUsername()) || '';
unameIn.value = username;

let resizeTimer = 0, lastH = 0, bgCache = null, bgKey = '';
function resize() {
  const r = stage.getBoundingClientRect();
  const nh = Math.max(300, Math.round(900 * (r.height / Math.max(1, r.width))));
  if (Math.abs(nh - lastH) < 3 && canvas.width === 900) return;
  lastH = nh;
  canvas.width = 900;
  canvas.height = nh;
  bgCache = null;
}
resize();
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resize, 120);
});

// ── Audio ────────────────────────────────────────────────
let AC = null, muted = false;
try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) {}
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  return AC;
}
function beep(f, d = 0.08, type = 'square', v = 0.07, delay = 0, slide = 0) {
  if (muted) return;
  const a = ac(); if (!a) return;
  const t0 = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t0 + d);
  g.gain.setValueAtTime(v, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0 + d + 0.02);
}
const sfx = {
  jump: () => { beep(300, 0.06); beep(460, 0.08, 'square', 0.05, 0.04); },
  coin: () => { beep(900, 0.05); beep(1300, 0.09, 'square', 0.05, 0.04); },
  stomp: (n) => beep(180 + Math.min(5, n || 1) * 28, 0.1, 'triangle', 0.09, 0, -60),
  hurt: () => { beep(240, 0.1, 'sawtooth', 0.07); beep(120, 0.16, 'sawtooth', 0.05, 0.05); },
  win: () => { beep(523, 0.1); beep(659, 0.1, 'square', 0.06, 0.1); beep(784, 0.16, 'square', 0.07, 0.2); },
  power: () => { beep(440, 0.07); beep(660, 0.09, 'square', 0.05, 0.06); },
  die: () => { beep(280, 0.12, 'sawtooth', 0.07); beep(140, 0.22, 'sawtooth', 0.06, 0.08, -100); },
  best: () => { beep(660, 0.08); beep(880, 0.1, 'square', 0.06, 0.07); beep(1175, 0.14, 'square', 0.07, 0.14); }
};

function setMuted(v) {
  muted = !!v;
  try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch (e) {}
  const btn = document.getElementById('btnMute');
  if (btn) {
    btn.textContent = muted ? 'MUT' : 'SND';
    btn.classList.toggle('on', muted);
  }
  if (!muted) { const a = ac(); if (a && a.state === 'suspended') a.resume(); }
}

// ── Input ────────────────────────────────────────────────
const keys = Object.create(null);
const setKey = (code, down) => { keys[code] = down; };
window.addEventListener('keydown', e => {
  setKey(e.code, true);
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (AC && AC.state === 'suspended') AC.resume();
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'KeyM') setMuted(!muted);
  if ((e.code === 'Enter' || e.code === 'Space') && (state === 'entry' || state === 'over' || state === 'clear')) {
    e.preventDefault();
    if (state === 'entry') startFromOverlay();
    else if (state === 'over') showEntry();
    else if (state === 'clear') nextLevel();
  }
  if (e.code === 'KeyR' && state === 'over') { e.preventDefault(); showEntry(); }
});
window.addEventListener('keyup', e => setKey(e.code, false));
window.addEventListener('pointerdown', () => { const a = ac(); if (a && a.state === 'suspended') a.resume(); });

function bindPad(id, code) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); setKey(code, true); el.classList.add('on'); };
  const off = e => { e.preventDefault(); setKey(code, false); el.classList.remove('on'); };
  ['touchstart', 'mousedown'].forEach(ev => el.addEventListener(ev, on, { passive: false }));
  ['touchend', 'touchcancel', 'mouseup', 'mouseleave'].forEach(ev => el.addEventListener(ev, off));
}
bindPad('btnL', 'ArrowLeft');
bindPad('btnR', 'ArrowRight');
bindPad('btnJ', 'Space');
document.getElementById('btnPause').addEventListener('click', e => { e.preventDefault(); togglePause(); });
document.getElementById('btnMute').addEventListener('click', e => {
  e.preventDefault();
  setMuted(!muted);
});
setMuted(muted);

const left = () => keys.ArrowLeft || keys.KeyA;
const right = () => keys.ArrowRight || keys.KeyD;
const jump = () => keys.Space || keys.ArrowUp || keys.KeyW;

// ── State ────────────────────────────────────────────────
let state = 'entry'; // entry|play|pause|dead|over|clear|pole
let score = 0, lives = 3, coins = 0, level = 1;
let camX = 0, camY = 0, shakeT = 0, shakeX = 0, shakeY = 0;
let frame = 0, last = 0, raf = 0, needsPaint = true;
let world = null, player = null;
let particles = [], floaters = [];
const particlePool = [];
let combo = 0, comboT = 0, toastT = 0;
let checkpoint = { set: false, x: 64, y: 0 };
let poleT = 0;
let submitted = false;
let personalBest = 0, beatBest = false, hudFlashT = 0;
const FLOATER_CAP = 24;
const PARTICLE_CAP = reduceMotion ? 40 : 80;

function refreshBestLine() {
  const el = document.getElementById('bestLine');
  if (!el || !window.SolarioLB) return;
  const me = SolarioLB.getUsername() || username;
  const pb = me ? SolarioLB.getPersonalBest(me) : 0;
  const top = SolarioLB.getTop(1)[0];
  if (pb > 0) el.textContent = `YOUR BEST · ${SolarioLB.formatScore(pb)}`;
  else if (top) el.textContent = `BOARD LEADER · ${top.name} ${SolarioLB.formatScore(top.score)}`;
  else el.textContent = '';
}
refreshBestLine();

function hud() {
  document.getElementById('hName').textContent = username || '---';
  document.getElementById('hScore').textContent = score.toLocaleString();
  document.getElementById('hLives').textContent = '🌙'.repeat(Math.max(0, lives)) || '—';
  document.getElementById('hLevel').textContent = String(level);
  document.getElementById('hCoins').textContent = String(coins);
  if (hudFlashT > 0) document.getElementById('hud').classList.add('flash');
}

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.style.opacity = '1';
  toastT = 90;
}

function addScore(n, x, y, label, color) {
  if (!n) return;
  score += n;
  hudFlashT = 18;
  document.getElementById('hud').classList.add('flash');
  if (label) floater(x, y, label, color);
  if (!beatBest && personalBest > 0 && score > personalBest) {
    beatBest = true;
    toast('NEW PERSONAL BEST');
    sfx.best();
  }
  hud();
}

function burst(x, y, color, n, spdMul) {
  n = (n == null) ? 10 : n;
  if (reduceMotion) n = Math.ceil(n * 0.45);
  spdMul = (spdMul == null) ? 1 : spdMul;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = (1.5 + Math.random() * 3) * spdMul;
    const p = particlePool.pop() || {};
    p.x = x; p.y = y; p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s - 2;
    p.life = 1; p.fade = 0.03; p.color = color; p.r = 1.5 + Math.random() * 2;
    particles.push(p);
  }
  while (particles.length > PARTICLE_CAP) {
    const old = particles.shift();
    if (old) particlePool.push(old);
  }
}
function floater(x, y, text, color = '#ffd700') {
  floaters.push({ x, y, text, color, life: 1, vy: -1.2 });
  if (floaters.length > FLOATER_CAP) floaters.shift();
}

// ── Themes & levels ──────────────────────────────────────
const THEMES = [
  { name: 'MOON DISTRICT', sky: ['#07061a', '#160a35'], ground: '#6d28d9', dirt: '#1a0545', brick: ['#3b0764', '#7c3aed'], enemy: ['#ef4444', '#7f1d1d'], stars: true, moon: true },
  { name: 'CRYPTO CITY', sky: ['#021018', '#053044'], ground: '#10b981', dirt: '#042f1e', brick: ['#064e3b', '#059669'], enemy: ['#a855f7', '#4c1d95'], stars: false, city: true },
  { name: 'DIAMOND PEAKS', sky: ['#1a0800', '#3d1400'], ground: '#f97316', dirt: '#3d0a00', brick: ['#7c2d12', '#ea580c'], enemy: ['#3b82f6', '#1e3a8a'], stars: false, lava: true },
  { name: 'TO THE MOON', sky: ['#000008', '#0a0a22'], ground: '#f0b429', dirt: '#1a1400', brick: ['#1e3a8a', '#3b82f6'], enemy: ['#ef4444', '#991b1b'], stars: true, space: true }
];

function levelPlan(n, gr) {
  const plans = [
    {
      w: 68, gaps: [30, 31], cps: [34],
      plats: [[5,3,4],[11,4,3],[16,3,4],[22,5,3],[26,3,4],[29,5,3],[34,3,5],[40,5,4],[46,3,4],[52,4,3],[58,3,4],[62,6,3]],
      qs: [[7,6,'coin'],[12,7,'shroom'],[18,6,'coin'],[24,8,'coin'],[36,6,'shroom'],[42,8,'star'],[50,6,'coin'],[60,7,'coin']],
      enemies: [[20,0],[38,0],[48,0],[60,0]],
      coins: [[3,1,5],[5,4,4],[11,5,3],[16,4,4],[22,6,3],[34,4,5],[40,6,4],[52,5,3],[62,7,3]]
    },
    {
      w: 78, gaps: [12,13,24,25,40,41,55,56], cps: [28,52],
      plats: [[4,4,4],[10,5,3],[15,4,4],[18,7,3],[26,4,5],[32,6,3,1],[38,4,4],[44,6,3],[48,4,4,1],[54,5,3],[60,4,4],[66,5,4],[72,4,3]],
      qs: [[5,7,'coin'],[11,8,'shroom'],[19,9,'star'],[27,7,'coin'],[39,7,'coin'],[49,8,'shroom'],[61,7,'coin'],[67,8,'star']],
      enemies: [[8,0],[16,0],[30,1],[38,0],[46,1],[58,0],[70,0]],
      coins: [[4,5,4],[15,5,4],[26,5,5],[38,5,4],[54,6,3],[66,6,4]]
    },
    {
      w: 88, gaps: [10,11,12,22,23,35,36,37,50,51,64,65,66], cps: [30,58],
      plats: [[4,4,4],[8,7,3],[14,5,4],[18,8,3,1],[24,4,4],[28,7,3],[32,9,3,1],[38,5,4],[44,8,3],[48,5,4,1],[54,5,4],[60,8,3],[64,11,3,1],[72,5,5],[78,8,3],[82,5,4]],
      qs: [[5,7,'coin'],[9,10,'shroom'],[25,7,'star'],[39,8,'coin'],[45,11,'shroom'],[55,8,'star'],[73,8,'coin'],[79,11,'shroom']],
      enemies: [[7,0],[15,1],[26,0],[34,1],[42,0],[52,1],[62,0],[74,0],[80,1]],
      coins: [[4,5,4],[14,6,4],[24,5,4],[38,6,4],[54,6,4],[72,6,5],[82,6,4]]
    },
    {
      w: 96, gaps: [8,9,16,17,28,29,30,42,43,54,55,68,69,70,82,83], cps: [32,64],
      plats: [[3,4,3],[6,7,3],[12,5,4],[15,8,3,1],[20,4,4],[24,8,3],[26,11,3,1],[34,5,4],[38,9,3,1],[44,5,4],[48,8,3],[50,12,3,1],[58,5,4],[62,9,3],[64,13,3,1],[74,5,4],[78,9,3,1],[84,5,4],[90,8,4]],
      qs: [[4,7,'coin'],[7,10,'shroom'],[13,8,'star'],[21,7,'coin'],[35,8,'shroom'],[45,8,'star'],[59,8,'coin'],[75,8,'star'],[85,8,'shroom'],[91,11,'coin']],
      enemies: [[12,1],[21,0],[34,0],[40,1],[50,0],[60,0],[66,1],[76,0],[86,1],[92,0]],
      coins: [[3,5,3],[12,6,4],[20,5,4],[34,6,4],[44,6,4],[58,6,4],[74,6,4],[84,6,4],[90,9,3]]
    }
  ];
  return plans[(n - 1) % 4];
}

function buildLevel(n) {
  const theme = THEMES[(n - 1) % 4];
  const gr = Math.floor(H() / T) - 3;
  const GY = gr * T;
  const plan = levelPlan(n, gr);
  const plats = [];
  const gapSet = new Set(plan.gaps);
  for (let x = 0; x < plan.w; x++) {
    if (!gapSet.has(x)) plats.push({ x: x * T, y: GY, w: T, h: H() - GY + 200, type: 'ground' });
  }
  for (const p of plan.plats) {
    const [tx, dy, tw, mov] = p;
    const x = tx * T, y = (gr - dy) * T, w = tw * T;
    const seed = (tx * 17 + dy * 31 + n * 7) | 0;
    plats.push({
      x, y, w, h: T, type: 'brick',
      mov: !!mov, mx: x, mr: mov ? 48 + (seed % 30) : 0,
      ms: mov ? (0.9 + (seed % 10) / 10) * ((seed & 1) ? 1 : -1) : 0,
      mt: seed % 80, dx: 0
    });
  }
  for (const q of plan.qs) {
    plats.push({ x: q[0] * T, y: (gr - q[1]) * T, w: T, h: T, type: 'q', content: q[2], hit: false, bump: 0 });
  }
  const coinArr = [];
  for (const c of plan.coins) {
    for (let i = 0; i < c[2]; i++) {
      coinArr.push({ x: c[0] * T + i * T + T / 2, y: (gr - c[1]) * T, r: 9, taken: false, a: Math.random() * 6 });
    }
  }
  const enemies = plan.enemies.map(e => {
    const seed = (e[0] * 13 + n * 41) | 0;
    const dir = (seed & 1) ? 1 : -1;
    const fly = !!e[1];
    return {
      x: e[0] * T, y: fly ? GY - T * 3 : GY - 28, w: 28, h: 28,
      vx: dir * (1.05 + 0.12 * n), vy: 0, alive: true, fly,
      fa: (seed % 628) / 100, fAmp: 22 + (seed % 14), baseY: fly ? GY - T * 3 : GY - 28,
      hp: n >= 3 ? 2 : 1, flash: 0, sq: 0, dir
    };
  });
  const lava = [];
  if (theme.lava) {
    for (const g of plan.gaps) lava.push({ x: g * T, y: GY + 4, w: T, h: 14 });
  }
  const checkpoints = (plan.cps || []).map(cx => ({ x: cx * T, y: GY - T, got: false }));
  return {
    theme, gr, GY, WW: plan.w, plats, coins: coinArr, enemies, lava, checkpoints,
    flagX: (plan.w - 3) * T, flagY: (gr - 6) * T, powerups: []
  };
}

function makePlayer() {
  const x = checkpoint.set ? checkpoint.x : 2 * T;
  const y = checkpoint.set ? checkpoint.y : world.GY - 40;
  return {
    x, y, w: 22, h: 34, vx: 0, vy: 0, on: false, face: 1,
    power: 0, powerT: 0, inv: 80, coy: 0, jbuf: 0, land: 0, walk: 0, dust: 0
  };
}

// ── Collision helpers ────────────────────────────────────
function aabb(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function resolvePlayer(dt) {
  player.x += player.vx * dt;
  player.x = Math.max(0, player.x);
  for (const p of world.plats) {
    if (aabb(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)) {
      if (player.vx > 0) player.x = p.x - player.w;
      else if (player.vx < 0) player.x = p.x + p.w;
      player.vx = 0;
    }
  }
  player.vy += GRAV * dt;
  if (player.vy > MAX_FALL) player.vy = MAX_FALL;
  player.y += player.vy * dt;
  player.on = false;
  for (const p of world.plats) {
    if (aabb(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)) {
      if (player.vy > 0 && player.y + player.h - player.vy * dt <= p.y + 6) {
        player.y = p.y - player.h; player.vy = 0; player.on = true;
      } else if (player.vy < 0) {
        player.y = p.y + p.h; player.vy = 1.2;
        if (p.type === 'q' && !p.hit) {
          p.hit = true; p.bump = 10; hitQ(p);
        }
      }
    }
  }
}

function hitQ(p) {
  if (p.content === 'coin') {
    sfx.coin();
    addScore(50, p.x + 16, p.y - 8, '+50');
    coins++; burst(p.x + 16, p.y, '#ffd700', 10); hud();
  } else if (p.content === 'shroom') {
    world.powerups.push({ x: p.x + 8, y: p.y - 20, t: 'shroom', vx: 1.5, vy: -3, dead: false });
    sfx.power();
  } else if (p.content === 'star') {
    world.powerups.push({ x: p.x + 8, y: p.y - 20, t: 'star', vx: 1.2, vy: -4, dead: false });
    sfx.power();
  }
}

function resolveEnemy(e, dt) {
  if (e.fly) {
    e.fa += 0.03 * dt;
    e.x += e.vx * dt;
    e.y = e.baseY + Math.sin(e.fa) * e.fAmp;
    if (e.x < 0 || e.x > world.WW * T) e.vx *= -1;
    e.dir = e.vx > 0 ? 1 : -1;
    return;
  }
  e.vy += GRAV * dt;
  e.x += e.vx * dt;
  for (const p of world.plats) {
    if (aabb(e.x, e.y, e.w, e.h, p.x, p.y, p.w, p.h)) {
      e.x = e.vx > 0 ? p.x - e.w : p.x + p.w;
      e.vx *= -1;
    }
  }
  e.y += e.vy * dt;
  let on = false;
  for (const p of world.plats) {
    if (aabb(e.x, e.y, e.w, e.h, p.x, p.y, p.w, p.h)) {
      if (e.vy > 0 && e.y + e.h - e.vy * dt <= p.y + 4) { e.y = p.y - e.h; e.vy = 0; on = true; }
      else { e.y = p.y + p.h; e.vy = 1; }
    }
  }
  if (on) {
    const ex = e.x + (e.vx > 0 ? e.w + 2 : -2);
    const ey = e.y + e.h + 4;
    let floor = false;
    for (const p of world.plats) {
      if (ex >= p.x && ex < p.x + p.w && ey >= p.y && ey <= p.y + T) { floor = true; break; }
    }
    if (!floor) e.vx *= -1;
  }
  e.dir = e.vx > 0 ? 1 : -1;
}

// ── Game flow ────────────────────────────────────────────
function clearJump() {
  ['Space', 'ArrowUp', 'KeyW'].forEach(k => { keys[k] = false; });
}

function loadLevel() {
  world = buildLevel(level);
  world.powerups = [];
  if (checkpoint.set && world.checkpoints) {
    for (const c of world.checkpoints) if (c.x <= checkpoint.x) c.got = true;
  }
  player = makePlayer();
  while (particles.length) { const p = particles.pop(); if (p) particlePool.push(p); }
  floaters = [];
  camX = Math.max(0, player.x - W() / 3); camY = 0;
  frame = 0; combo = 0; comboT = 0;
  bgCache = null;
  clearJump();
  hud();
  toast(world.theme.name);
  progEl.classList.add('show');
  needsPaint = true;
}

function startFromOverlay() {
  const input = document.getElementById('uname');
  const raw = input ? String(input.value || '').trim() : '';
  if (raw.length < 2) {
    if (input) input.focus();
    toast('ENTER A USERNAME');
    return;
  }
  const name = window.SolarioLB
    ? SolarioLB.setUsername(raw)
    : raw.toUpperCase().replace(/[^A-Z0-9_]/g, '').slice(0, 12);
  if (!name || name.length < 2) {
    if (input) input.focus();
    toast('ENTER A USERNAME');
    return;
  }
  username = name;
  personalBest = window.SolarioLB ? SolarioLB.getPersonalBest(username) : 0;
  beatBest = false;
  score = 0; lives = 3; coins = 0; level = 1;
  checkpoint = { set: false, x: 64, y: 0 };
  submitted = false;
  overlay.classList.add('hidden');
  loadLevel();
  state = 'play';
  hud();
  if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); }
}

function showEntry() {
  state = 'entry';
  progEl.classList.remove('show');
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <div class="logo">SUPER<br>SOLARIO</div>
    <div class="sub">ON-CHAIN PLATFORMER</div>
    <div class="blurb">Enter a wallet alias, then stomp bears &amp; stack <b>$SOLARIO</b>.<br>Top scores hit the live leaderboard.</div>
    <div class="best" id="bestLine"></div>
    <input id="uname" maxlength="12" placeholder="USERNAME" autocomplete="off" spellcheck="false" value="${username}">
    <div class="row"><button class="btn" id="btnStart">LAUNCH</button></div>
    <div class="hint">← → MOVE · SPACE JUMP · P PAUSE · M MUTE</div>`;
  refreshBestLine();
  const input = document.getElementById('uname');
  const btn = document.getElementById('btnStart');
  btn.onclick = startFromOverlay;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') startFromOverlay(); });
  input.focus();
  needsPaint = true;
}

function submitToBoard(force) {
  if (!force && submitted) return null;
  if (score <= 0 || !username) return null;
  submitted = true;
  if (!window.SolarioLB) return null;
  const res = SolarioLB.submitScore({ name: username, score, coins, level });
  try {
    parent.postMessage({ type: 'solario-score', payload: res }, '*');
  } catch (e) {}
  if (res && res.ok) toast(res.improved ? `BOARD #${res.rank}` : 'BEST KEPT');
  return res;
}

async function doShare(rank) {
  if (!window.SolarioLB) return;
  const res = await SolarioLB.shareScore({ name: username, score, coins, level, rank });
  if (res.ok) toast(res.method === 'share' ? 'SHARED' : 'COPIED');
  else if (res.reason !== 'abort') toast('COPY FAILED');
}

function bindShare(btnId, rank) {
  const b = document.getElementById(btnId);
  if (b) b.onclick = () => doShare(rank);
}

function gameOver() {
  state = 'over';
  progEl.classList.remove('show');
  const res = submitToBoard(true);
  const rank = res && res.rank ? res.rank : (window.SolarioLB ? SolarioLB.getRank(username) : 0);
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <div class="logo" style="font-size:clamp(16px,4vw,28px)">REKT</div>
    <div class="sub">PAPER HANDS DETECTED</div>
    <div class="blurb"><b>${username}</b> scored <b>${score.toLocaleString()}</b><br>${coins} coins · Lv ${level}${rank ? ` · Rank #${rank}` : ''}${beatBest ? '<br><span style="color:var(--mint)">NEW PERSONAL BEST</span>' : ''}</div>
    <div class="row">
      <button class="btn" id="btnRetry">RETRY</button>
      <button class="btn ghost" id="btnShare">SHARE</button>
      <button class="btn ghost" id="btnBoard">BOARD</button>
    </div>
    <div class="hint">ENTER / R TO RETRY</div>`;
  document.getElementById('btnRetry').onclick = () => showEntry();
  bindShare('btnShare', rank);
  document.getElementById('btnBoard').onclick = () => {
    try { parent.postMessage({ type: 'solario-scroll-lb' }, '*'); } catch (e) {}
  };
}

function levelClearUI() {
  state = 'clear';
  const res = submitToBoard(true);
  submitted = false; // allow later death submit / higher score
  const rank = res && res.rank ? res.rank : (window.SolarioLB ? SolarioLB.getRank(username) : 0);
  overlay.classList.remove('hidden');
  const nextTheme = THEMES[level % 4];
  overlay.innerHTML = `
    <div class="logo" style="font-size:clamp(16px,4vw,28px)">LEVEL ${level}<br>CLEARED</div>
    <div class="sub">+${(1200 * level).toLocaleString()} $SOLARIO</div>
    <div class="blurb">Total <b>${score.toLocaleString()}</b> · Next: ${nextTheme.name}${rank ? ` · Rank #${rank}` : ''}</div>
    <div class="row">
      <button class="btn" id="btnNext">NEXT LEVEL</button>
      <button class="btn ghost" id="btnShare">SHARE</button>
    </div>
    <div class="hint">ENTER TO CONTINUE</div>`;
  document.getElementById('btnNext').onclick = nextLevel;
  bindShare('btnShare', rank);
}

function nextLevel() {
  level++;
  checkpoint = { set: false, x: 64, y: 0 };
  overlay.classList.add('hidden');
  loadLevel();
  state = 'play';
  submitted = false;
}

function togglePause() {
  if (state === 'play') {
    state = 'pause';
  } else if (state === 'pause') {
    state = 'play';
    last = performance.now();
  }
}

function hurt(fell = false) {
  if (player.inv > 0) return;
  combo = 0; comboT = 0;
  if (player.power > 0 && !fell) {
    player.power = Math.max(0, player.power - 1);
    player.inv = 100;
    player.vx = -player.face * 5.5;
    player.vy = -7;
    sfx.hurt(); toast('OUCH — DIAMOND HANDS');
    burst(player.x + 11, player.y + 16, '#ff3b5c', 14);
    hud(); return;
  }
  lives--; hud();
  sfx.die(); burst(player.x + 11, player.y + 16, '#ff3b5c', 20, 1.3);
  shakeT = 18;
  if (lives <= 0) {
    state = 'dead';
    setTimeout(gameOver, 700);
  } else {
    state = 'dead';
    setTimeout(() => { loadLevel(); state = 'play'; }, 800);
  }
}

// ── Update ───────────────────────────────────────────────
function update(dt) {
  if (state === 'pause' || state === 'entry' || state === 'over' || state === 'clear' || state === 'dead') return;

  if (state === 'pole') {
    frame++; poleT++;
    player.vx = 0; player.x = world.flagX + 2;
    const bottom = world.GY - player.h;
    player.y = Math.min(bottom, player.y + 3 * dt);
    if (player.y >= bottom - 1 || poleT > 80) {
      addScore(1200 * level, world.flagX + 12, world.flagY, '+' + (1200 * level));
      sfx.win(); burst(world.flagX + 12, world.flagY, '#ffd700', 28, 1.3);
      setTimeout(levelClearUI, 450);
      state = 'clear';
    }
    tickFx(dt);
    return;
  }

  if (state !== 'play') return;
  frame++;

  const spd = player.power === 2 ? 6.3 : 4.9;
  const want = left() ? -spd : right() ? spd : 0;
  if (want !== 0) {
    const a = player.on ? 0.55 : 0.28;
    player.vx += Math.sign(want - player.vx) * Math.min(Math.abs(want - player.vx), a * dt * spd);
    if ((want > 0 && player.vx > want) || (want < 0 && player.vx < want)) player.vx = want;
  } else {
    player.vx *= Math.pow(player.on ? 0.78 : 0.92, dt);
    if (Math.abs(player.vx) < 0.08) player.vx = 0;
  }
  if (left()) player.face = -1;
  if (right()) player.face = 1;

  if (player.on) player.coy = 12; else if (player.coy > 0) player.coy--;
  if (jump()) player.jbuf = 10; else if (player.jbuf > 0) player.jbuf--;
  if (player.jbuf > 0 && player.coy > 0) {
    player.vy = player.power === 2 ? -14.2 : player.power === 1 ? -12.8 : -11.6;
    player.on = false; player.jbuf = 0; player.coy = 0;
    burst(player.x + 11, player.y + player.h, '#c4b5fd', 7);
    sfx.jump();
  }
  if (!jump() && player.vy < -3.5) player.vy *= Math.pow(0.55, dt * 0.35);

  for (const p of world.plats) {
    if (p.mov) {
      const prev = p.x;
      p.mt += 1;
      p.x = p.mx + Math.sin(p.mt * p.ms * 0.024) * p.mr;
      p.dx = p.x - prev;
      if (player.on && aabb(player.x, player.y + 1, player.w, player.h, p.x - p.dx, p.y - 2, p.w, p.h + 4)) {
        player.x += p.dx;
      }
    }
    if (p.bump > 0) p.bump--;
  }

  const wasOn = player.on;
  resolvePlayer(dt);
  if (player.on && !wasOn) {
    player.land = 6;
    burst(player.x + 11, player.y + player.h, '#a78bfa', 6, 0.5);
  }
  if (player.land > 0) player.land--;
  if (player.inv > 0) player.inv--;
  if (player.powerT > 0) {
    player.powerT--;
    if (player.powerT <= 0 && player.power === 2) { player.power = 1; toast('MOON MODE OVER'); }
  }

  if (player.on && Math.abs(player.vx) > 2) {
    player.dust += dt;
    if (player.dust > 2.2) {
      player.dust = 0;
      particles.push({ x: player.x + 11 - player.face * 6, y: player.y + player.h - 2, vx: -player.face * 0.5, vy: -0.3, life: 0.6, fade: 0.05, color: '#c4b5fd', r: 2 });
    }
  }
  if (Math.abs(player.vx) > 0.5 && player.on) player.walk += Math.abs(player.vx) * 0.2 * dt;

  if (comboT > 0) { comboT--; if (comboT <= 0) combo = 0; }

  for (const c of world.checkpoints) {
    if (!c.got && player.x + player.w > c.x) {
      c.got = true;
      checkpoint = { set: true, x: c.x, y: world.GY - player.h };
      toast('CHECKPOINT');
      burst(c.x, c.y, '#19f5a0', 12);
      sfx.power();
    }
  }

  // camera
  const tx = player.x - W() / 3 + player.vx * 10;
  camX += (Math.max(0, Math.min(tx, world.WW * T - W())) - camX) * 0.22 * dt;
  const sy = player.y - camY;
  let iy = camY;
  if (sy < H() * 0.28) iy = player.y - H() * 0.28;
  else if (sy > H() * 0.72) iy = Math.max(0, player.y - H() * 0.72);
  camY += (Math.max(0, iy) - camY) * 0.14 * dt;
  if (shakeT > 0 && !reduceMotion) { shakeT--; shakeX = (Math.random() - 0.5) * 5; shakeY = (Math.random() - 0.5) * 5; }
  else { shakeX = shakeY = 0; shakeT = 0; }

  for (const c of world.coins) {
    if (c.taken) continue;
    c.a += 0.07 * dt;
    if (aabb(player.x, player.y, player.w, player.h, c.x - c.r, c.y - c.r, c.r * 2, c.r * 2)) {
      c.taken = true; coins++;
      addScore(10, c.x, c.y - 10, '+10');
      burst(c.x, c.y, '#ffd700', 8);
      sfx.coin();
      if (coins % 100 === 0) { lives++; toast('EXTRA LIFE'); hud(); }
    }
  }

  for (const pu of world.powerups) {
    if (pu.dead) continue;
    pu.vy += GRAV * dt; pu.x += pu.vx * dt; pu.y += pu.vy * dt;
    for (const p of world.plats) {
      if (aabb(pu.x, pu.y, 16, 16, p.x, p.y, p.w, p.h)) {
        if (pu.vy > 0) { pu.y = p.y - 16; pu.vy = 0; }
        else { pu.vx *= -1; }
      }
    }
    if (aabb(player.x, player.y, player.w, player.h, pu.x, pu.y, 16, 16)) {
      pu.dead = true; sfx.power();
      if (pu.t === 'shroom') {
        player.power = Math.max(player.power, 1);
        addScore(200, pu.x, pu.y, '+200', '#19f5a0');
        toast('SUPER SOLARIO');
      } else {
        player.power = 2; player.powerT = 520;
        addScore(500, pu.x, pu.y, '+500');
        toast('MOON MODE'); burst(pu.x, pu.y, '#ffd700', 18, 1.4);
      }
    }
  }

  for (const e of world.enemies) {
    if (!e.alive) { if (e.sq > 0) e.sq--; continue; }
    if (e.flash > 0) e.flash--;
    resolveEnemy(e, dt);
    if (player.inv === 0 && aabb(player.x, player.y, player.w, player.h, e.x, e.y, e.w, e.h)) {
      if (player.power === 2) {
        e.alive = false; combo++; comboT = 50;
        const pts = 500 * Math.min(combo, 5);
        addScore(pts, e.x + 14, e.y, combo > 1 ? `x${combo} +${pts}` : '+500');
        sfx.stomp(combo); burst(e.x + 14, e.y + 14, '#ff8a00', 12);
      } else if (player.vy > 0.8 && player.y + player.h < e.y + e.h * 0.62) {
        e.hp--; player.vy = -9.2; combo++; comboT = 50; sfx.stomp(combo);
        if (e.hp <= 0) {
          e.alive = false; e.sq = 24;
          const pts = 200 * Math.min(combo, 5);
          addScore(pts, e.x + 14, e.y, combo > 1 ? `x${combo} +${pts}` : '+200');
          burst(e.x + 14, e.y + 14, '#ff8a00', 12);
        } else { e.flash = 16; e.vx *= -1; floater(e.x + 14, e.y, 'HIT'); }
      } else hurt();
    }
  }

  for (const lv of world.lava) {
    if (aabb(player.x, player.y, player.w, player.h, lv.x, lv.y - 4, lv.w, lv.h + 8)) { hurt(true); break; }
  }
  if (player.y > world.GY + 120) hurt(true);

  if (aabb(player.x, player.y, player.w, player.h, world.flagX, world.flagY, 28, world.GY - world.flagY)) {
    state = 'pole'; poleT = 0; player.vx = player.vy = 0;
    toast('FLAG!'); sfx.win();
  }

  tickFx(dt);
}

function tickFx(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += GRAV * 0.25 * dt; p.life -= p.fade * dt;
    if (p.life <= 0) {
      particles.splice(i, 1);
      if (particlePool.length < 120) particlePool.push(p);
    }
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.y += f.vy * dt; f.life -= 0.018 * dt;
    if (f.life <= 0) floaters.splice(i, 1);
  }
  if (toastT > 0) { toastT--; if (toastT <= 0) toastEl.style.opacity = '0'; }
  if (hudFlashT > 0) {
    hudFlashT--;
    if (hudFlashT <= 0) document.getElementById('hud').classList.remove('flash');
  }
  if (player && world && (state === 'play' || state === 'pole')) {
    const pct = Math.max(0, Math.min(1, player.x / Math.max(1, world.flagX)));
    progFill.style.width = (pct * 100).toFixed(1) + '%';
  }
}

// ── Draw ─────────────────────────────────────────────────
function drawBG() {
  const th = world.theme;
  const key = th.name + ':' + W() + 'x' + H();
  if (!bgCache || bgKey !== key) {
    bgCache = ctx.createLinearGradient(0, 0, 0, H());
    bgCache.addColorStop(0, th.sky[0]); bgCache.addColorStop(1, th.sky[1]);
    bgKey = key;
  }
  ctx.fillStyle = bgCache; ctx.fillRect(0, 0, W(), H());
  if (th.stars) {
    const starN = reduceMotion ? 40 : 80;
    for (let i = 0; i < starN; i++) {
      const x = ((i * 97) - camX * 0.08) % W();
      const y = (i * 53) % (H() * 0.7);
      ctx.globalAlpha = reduceMotion ? 0.55 : (0.35 + 0.65 * Math.abs(Math.sin(frame * 0.03 + i)));
      ctx.fillStyle = '#fff';
      ctx.fillRect(x, y, 1 + (i % 2), 1 + (i % 2));
    }
    ctx.globalAlpha = 1;
  }
  if (th.moon) {
    ctx.globalAlpha = 0.16; ctx.fillStyle = '#ffe9a0';
    ctx.beginPath(); ctx.arc(W() * 0.78, 70, 58, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#12082a';
    for (let i = 0; i < 10; i++) {
      const hx = ((i * 100) - camX * 0.12) % (W() + 120) - 40;
      ctx.beginPath(); ctx.ellipse(hx, H() - 6, 55, 26 + (i % 3) * 10, 0, Math.PI, 0); ctx.fill();
    }
  }
  if (th.city) {
    ctx.fillStyle = '#021a10';
    for (let i = 0; i < 14; i++) {
      const bx = ((i * 70) - camX * 0.25) % (W() + 80) - 20;
      const bh = 60 + (i % 5) * 28;
      ctx.fillRect(bx, H() - bh, 40 + (i % 3) * 10, bh);
      ctx.fillStyle = 'rgba(255,220,100,.25)';
      for (let wy = H() - bh + 8; wy < H() - 8; wy += 14)
        for (let wx = bx + 6; wx < bx + 36; wx += 10) if ((wx + wy + i) % 3) ctx.fillRect(wx, wy, 4, 6);
      ctx.fillStyle = '#021a10';
    }
  }
  if (th.space) {
    ctx.globalAlpha = 0.08;
    const n = ctx.createRadialGradient(W() * 0.3, H() * 0.4, 10, W() * 0.3, H() * 0.4, 180);
    n.addColorStop(0, '#6366f1'); n.addColorStop(1, 'transparent');
    ctx.fillStyle = n; ctx.fillRect(0, 0, W(), H());
    ctx.globalAlpha = 1;
  }
}

function drawPlats() {
  const th = world.theme;
  for (const p of world.plats) {
    const sx = p.x - camX;
    if (sx > W() + 40 || sx + p.w < -40) continue;
    if (p.type === 'ground') {
      ctx.fillStyle = th.dirt; ctx.fillRect(sx, p.y + T, p.w, p.h);
      ctx.fillStyle = th.ground; ctx.fillRect(sx, p.y, p.w, T);
      ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(sx, p.y, p.w, 4);
      for (let i = 0; i < p.w; i += T) {
        ctx.fillStyle = th.ground;
        ctx.fillRect(sx + i + 4, p.y - 4, 5, 5);
        ctx.fillRect(sx + i + 14, p.y - 3, 4, 4);
      }
    } else if (p.type === 'brick') {
      ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(sx + 3, p.y + p.h - 1, p.w, 5);
      ctx.fillStyle = th.brick[0]; ctx.fillRect(sx, p.y, p.w, p.h);
      ctx.fillStyle = th.brick[1];
      for (let b = 0; b < p.w; b += T) {
        ctx.fillRect(sx + b + 2, p.y + 2, T - 4, 12);
        ctx.fillRect(sx + b + 2, p.y + 17, T - 4, 12);
      }
      ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(sx, p.y, p.w, 3);
      if (p.mov) { ctx.fillStyle = '#f0b429'; ctx.fillRect(sx, p.y, p.w, 2); }
    } else if (p.type === 'q') {
      const bob = p.bump > 0 ? -p.bump * 0.5 : 0;
      if (p.hit) {
        ctx.fillStyle = '#4b4b5a'; ctx.fillRect(sx, p.y + bob, T, T);
      } else {
        ctx.fillStyle = '#f59e0b'; ctx.fillRect(sx, p.y + bob, T, T);
        ctx.fillStyle = '#fcd34d'; ctx.fillRect(sx + 2, p.y + bob + 2, T - 4, T - 4);
        ctx.fillStyle = '#78350f';
        ctx.font = "bold 13px 'Press Start 2P'";
        ctx.textAlign = 'center'; ctx.fillText('$', sx + 16, p.y + bob + 22);
      }
    }
  }
}

function drawWorld() {
  // checkpoints
  for (const c of world.checkpoints) {
    const sx = c.x - camX;
    if (sx < -20 || sx > W() + 20) continue;
    ctx.fillStyle = c.got ? '#19f5a0' : '#f0b429';
    ctx.fillRect(sx, c.y - 40, 3, 40);
    ctx.beginPath(); ctx.moveTo(sx + 3, c.y - 40); ctx.lineTo(sx + 18, c.y - 32); ctx.lineTo(sx + 3, c.y - 24); ctx.fill();
  }
  // lava
  for (const lv of world.lava) {
    const sx = lv.x - camX;
    const pulse = Math.sin(frame * 0.1) * 2;
    const g = ctx.createLinearGradient(0, lv.y, 0, lv.y + lv.h);
    g.addColorStop(0, '#ff4500'); g.addColorStop(1, '#991b1b');
    ctx.fillStyle = g; ctx.fillRect(sx, lv.y + pulse, lv.w, lv.h);
  }
  // coins
  for (const c of world.coins) {
    if (c.taken) continue;
    const sx = c.x - camX;
    if (sx < -20 || sx > W() + 20) continue;
    const sc = Math.abs(Math.cos(c.a)) * 0.8 + 0.2;
    const bob = Math.sin(c.a) * 2.5;
    ctx.save(); ctx.translate(sx, c.y + bob);
    ctx.fillStyle = '#ffd700';
    ctx.beginPath(); ctx.ellipse(0, 0, c.r * sc, c.r, 0, 0, Math.PI * 2); ctx.fill();
    if (sc > 0.45) {
      ctx.fillStyle = '#92400e'; ctx.font = "bold 7px 'Press Start 2P'";
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('$', 0, 1);
    }
    ctx.restore();
  }
  // powerups
  for (const pu of world.powerups) {
    if (pu.dead) continue;
    const sx = pu.x - camX;
    ctx.save(); ctx.translate(sx + 8, pu.y + 8);
    if (pu.t === 'shroom') {
      ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.arc(0, -3, 9, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#fef3c7'; ctx.fillRect(-5, 0, 10, 9);
    } else {
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const a = -Math.PI / 2 + i * Math.PI * 2 / 5;
        const r = i === 0 ? 10 : 10;
        const x = Math.cos(a) * r, y = Math.sin(a) * r;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        const a2 = a + Math.PI / 5;
        ctx.lineTo(Math.cos(a2) * 4, Math.sin(a2) * 4);
      }
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  // flag
  {
    const sx = world.flagX - camX;
    const wave = Math.sin(frame * 0.08) * 3;
    ctx.fillStyle = '#9ca3af'; ctx.fillRect(sx + 9, world.flagY, 4, world.GY - world.flagY);
    ctx.fillStyle = '#19f5a0';
    ctx.beginPath();
    ctx.moveTo(sx + 13, world.flagY + 4);
    ctx.quadraticCurveTo(sx + 40 + wave, world.flagY + 18, sx + 50 + wave, world.flagY + 14);
    ctx.quadraticCurveTo(sx + 40 + wave, world.flagY + 30, sx + 13, world.flagY + 40);
    ctx.fill();
    ctx.fillStyle = '#064e3b'; ctx.font = "8px 'Press Start 2P'"; ctx.textAlign = 'center';
    ctx.fillText('$', sx + 30 + wave * 0.4, world.flagY + 26);
  }
  // enemies
  for (const e of world.enemies) {
    if (!e.alive && e.sq <= 0) continue;
    const sx = e.x - camX;
    if (sx < -50 || sx > W() + 50) continue;
    const sq = e.alive ? 1 : 0.25;
    ctx.save();
    ctx.translate(sx + e.w / 2, e.y + e.h * sq / 2); ctx.scale(e.dir, sq);
    if (e.flash > 0 && (frame % 2 === 0)) ctx.globalAlpha = 0.4;
    const th = world.theme;
    const rg = ctx.createRadialGradient(-3, -4, 2, 0, 0, 14);
    rg.addColorStop(0, th.enemy[0]); rg.addColorStop(1, th.enemy[1]);
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.ellipse(0, 0, 14, 14, 0, 0, Math.PI * 2); ctx.fill();
    if (e.alive) {
      if (e.fly) {
        ctx.fillStyle = 'rgba(255,255,255,.4)';
        ctx.beginPath(); ctx.ellipse(-16, -4, 8, 5, 0.3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(16, -4, 8, 5, -0.3, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = th.enemy[1];
      ctx.beginPath(); ctx.moveTo(-10, -12); ctx.lineTo(-14, -20); ctx.lineTo(-4, -12); ctx.fill();
      ctx.beginPath(); ctx.moveTo(10, -12); ctx.lineTo(14, -20); ctx.lineTo(4, -12); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillRect(-9, -8, 7, 7); ctx.fillRect(2, -8, 7, 7);
      ctx.fillStyle = '#111'; ctx.fillRect(-7, -6, 4, 4); ctx.fillRect(4, -6, 4, 4);
      if (e.hp >= 2) { ctx.fillStyle = '#ffd700'; ctx.fillRect(-7, -18, 5, 3); ctx.fillRect(2, -18, 5, 3); }
    }
    ctx.restore();
  }
  // player
  if (player && !(player.inv > 0 && frame % 6 < 3)) {
    const moon = player.power === 2, big = player.power >= 1;
    const ht = big ? player.h : player.h * 0.8;
    const squash = player.land > 0 ? 0.84 : (!player.on ? 0.92 : 1);
    const stretch = player.land > 0 ? 1.1 : (!player.on ? 1.06 : 1);
    ctx.save();
    ctx.translate(player.x + player.w / 2 - camX, player.y + ht / 2);
    ctx.scale(player.face * stretch, squash);
    if (moon) { ctx.globalAlpha = 0.95; }
    const leg = player.on ? Math.sin(player.walk * Math.PI) * 6 : (player.vy < 0 ? -2 : 3);
    ctx.fillStyle = moon ? '#fbbf24' : '#1d4ed8';
    ctx.fillRect(-9, ht / 4, 8, 8 + leg); ctx.fillRect(1, ht / 4, 8, 8 - leg);
    ctx.fillStyle = moon ? '#f59e0b' : '#1d4ed8'; ctx.fillRect(-10, -2, 20, ht / 3);
    ctx.fillStyle = moon ? '#fbbf24' : '#dc2626'; ctx.fillRect(-10, -ht / 3, 20, ht / 2);
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath(); ctx.ellipse(0, -ht / 2 + 8, 10, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#78350f'; ctx.fillRect(-6, -ht / 2 + 12, 12, 3);
    ctx.fillStyle = '#111'; ctx.fillRect(-7, -ht / 2 + 5, 5, 5); ctx.fillRect(3, -ht / 2 + 5, 5, 5);
    ctx.fillStyle = moon ? '#f59e0b' : '#dc2626';
    ctx.fillRect(-11, -ht / 2 - 4, 22, 7); ctx.fillRect(-7, -ht / 2 - 12, 14, 9);
    ctx.fillStyle = '#fff'; ctx.font = "5px 'Press Start 2P'"; ctx.textAlign = 'center';
    ctx.fillText('$', 0, -ht / 2 - 7);
    ctx.shadowBlur = 0; ctx.restore();
  }
  // particles / floaters
  for (const p of particles) {
    const sx = p.x - camX;
    if (sx < -20 || sx > W() + 20) continue;
    ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(sx, p.y, p.r * p.life, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const f of floaters) {
    ctx.globalAlpha = f.life; ctx.fillStyle = f.color;
    ctx.font = "8px 'Press Start 2P'";
    ctx.fillText(f.text, f.x - camX, f.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}

function render() {
  ctx.clearRect(0, 0, W(), H());
  if (!world) {
    ctx.fillStyle = '#05051a'; ctx.fillRect(0, 0, W(), H());
    for (let i = 0; i < 50; i++) {
      ctx.globalAlpha = 0.3 + 0.5 * Math.abs(Math.sin(frame * 0.02 + i));
      ctx.fillStyle = '#fff';
      ctx.fillRect((i * 97) % W(), (i * 53) % H(), 1, 1);
    }
    ctx.globalAlpha = 1;
    return;
  }
  ctx.save();
  ctx.translate(shakeX, shakeY);
  drawBG();
  ctx.restore();
  ctx.save();
  ctx.translate(shakeX, shakeY - camY);
  drawPlats();
  drawWorld();
  ctx.restore();

  if (combo > 1 && state === 'play') {
    ctx.fillStyle = '#ffd700'; ctx.font = "10px 'Press Start 2P'"; ctx.textAlign = 'center';
    ctx.fillText('COMBO x' + combo, W() / 2, 34); ctx.textAlign = 'left';
  }
  if (state === 'pause') {
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W(), H());
    ctx.fillStyle = '#f0b429'; ctx.font = "16px 'Press Start 2P'"; ctx.textAlign = 'center';
    ctx.fillText('PAUSED', W() / 2, H() / 2 - 8);
    ctx.font = "7px 'Press Start 2P'"; ctx.fillStyle = '#aaa';
    ctx.fillText('P / ESC TO RESUME · M MUTE', W() / 2, H() / 2 + 18);
    ctx.textAlign = 'left';
  }
  if (frame < 120 && state === 'play') {
    ctx.globalAlpha = Math.max(0, 1 - frame / 100) * 0.7;
    ctx.fillStyle = '#f0b429'; ctx.font = "9px 'Press Start 2P'"; ctx.textAlign = 'center';
    ctx.fillText(world.theme.name, W() / 2, H() / 2 - 20);
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }
}

function loop(t) {
  const dt = Math.min((t - last) / 16.67, 2.5);
  last = t;
  const busy = state === 'play' || state === 'pole' || state === 'dead' ||
    particles.length > 0 || floaters.length > 0 || toastT > 0 || shakeT > 0 || hudFlashT > 0;
  if (busy) {
    update(dt);
    render();
    needsPaint = true;
  } else if (state === 'pause') {
    if (needsPaint) { render(); needsPaint = false; }
  } else {
    frame++;
    if (needsPaint || frame % 10 === 0) { render(); needsPaint = false; }
  }
  raf = requestAnimationFrame(loop);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'play') { state = 'pause'; needsPaint = true; }
});

// boot
document.getElementById('btnStart').onclick = startFromOverlay;
unameIn.addEventListener('keydown', e => { if (e.key === 'Enter') startFromOverlay(); });
hud();
last = performance.now();
raf = requestAnimationFrame(loop);

// Expose for tests
window.__SOLARIO_GAME__ = {
  get state() { return state; },
  get score() { return score; },
  get coins() { return coins; },
  get level() { return level; },
  get lives() { return lives; },
  get username() { return username; },
  get muted() { return muted; },
  get personalBest() { return personalBest; },
  get playerX() { return player ? player.x : 0; },
  get playerY() { return player ? player.y : 0; },
  startFromOverlay,
  togglePause,
  submitToBoard,
  loadLevel,
  setMuted,
  // test helper: grant points as if collected
  __debugAddScore(n){ addScore(n); }
};
})();
</script>
</body>
</html>
