<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Super Solario Bros</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:#000;width:100%;height:100%;overflow:hidden;touch-action:none;}
#shell{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100vh;background:#000;}
#hud{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  width:min(900px,100vw);padding:8px 14px;
  background:linear-gradient(90deg,#070712,#1a0a28 50%,#070712);
  border-bottom:2px solid #f7c948;
  font-family:'Press Start 2P',monospace;flex-shrink:0;
}
.hb{display:flex;flex-direction:column;gap:3px;min-width:0;}
.hl{font-size:6px;color:#7a7a90;letter-spacing:1px;}
.hv{font-size:clamp(8px,1.6vw,11px);color:#f7c948;text-shadow:0 0 10px #f7c94855;}
#wrap{position:relative;width:min(900px,100vw);flex:1;overflow:hidden;border-left:2px solid #f7c948;border-right:2px solid #f7c948;background:#05051a;}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;}
#ov{
  position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(40,20,80,.96),rgba(4,4,18,.97));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;z-index:10;font-family:'Press Start 2P',monospace;padding:20px;
}
.logo{
  font-size:clamp(18px,5.5vw,38px);text-align:center;line-height:1.55;
  background:linear-gradient(135deg,#ffe08a,#f7c948,#ff6b00);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 18px #f7c94888);animation:glow 2s ease-in-out infinite alternate;
}
.sub{font-size:clamp(6px,1.5vw,8px);color:#f7c948;letter-spacing:2px;text-align:center;}
.inf{font-size:clamp(5px,1.4vw,7px);color:#aaa;text-align:center;line-height:2.2;max-width:420px;}
.inf b{color:#f7c948;}
.sc{font-size:clamp(10px,2.5vw,14px);color:#00ff9d;text-align:center;line-height:1.9;}
.hint{font-size:6px;color:#666;letter-spacing:1px;}
.btn{
  padding:14px 28px;background:linear-gradient(135deg,#f7c948,#ff6b00);
  color:#000;border:none;font-family:'Press Start 2P',monospace;font-size:clamp(8px,2vw,11px);
  cursor:pointer;box-shadow:0 4px 0 #7a3000,0 0 24px #f7c94855;letter-spacing:1px;
  transition:transform .08s,box-shadow .08s;margin-top:4px;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #7a3000,0 0 36px #f7c94888;}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #7a3000;}
#msg{
  position:absolute;top:12%;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.92);border:2px solid #f7c948;
  padding:8px 16px;color:#f7c948;font-family:'Press Start 2P',monospace;font-size:clamp(6px,1.5vw,8px);
  pointer-events:none;opacity:0;transition:opacity .25s;z-index:20;white-space:nowrap;
  box-shadow:0 0 24px #f7c94833;
}
#mctrl{
  display:none;width:min(900px,100vw);
  background:linear-gradient(90deg,#070712,#1a0a28);border-top:2px solid #f7c948;
  padding:10px 16px;justify-content:space-between;align-items:center;flex-shrink:0;
}
.cb{
  width:60px;height:60px;background:rgba(247,201,72,.12);
  border:2px solid #f7c948;border-radius:10px;color:#f7c948;
  font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  user-select:none;-webkit-user-select:none;box-shadow:0 3px 0 #7a6000;
  font-family:'Press Start 2P',monospace;transition:all .07s;touch-action:none;
}
.cb.on,.cb:active{background:rgba(247,201,72,.4);transform:translateY(2px);box-shadow:0 1px 0 #7a6000;}
.cj{width:72px;height:72px;border-radius:50%;background:rgba(255,107,0,.18);border-color:#ff6b00;color:#ff6b00;font-size:9px;}
.cg{display:flex;gap:10px;align-items:center;}
@keyframes glow{from{filter:drop-shadow(0 0 8px #f7c94866);}to{filter:drop-shadow(0 0 26px #f7c948cc);}}
@media(max-width:820px),(pointer:coarse){#mctrl{display:flex;}}
@media(max-height:500px){.cb{width:46px;height:46px;font-size:15px;}.cj{width:54px;height:54px;}}
</style>
</head>
<body>
<div id="shell">
  <div id="hud">
    <div class="hb"><span class="hl">$SOLARIO</span><span class="hv" id="hsc">0</span></div>
    <div class="hb" style="align-items:center"><span class="hl">LIVES</span><span class="hv" id="hlv">🌙🌙🌙</span></div>
    <div class="hb" style="align-items:center"><span class="hl">LEVEL</span><span class="hv" id="hlvl">1</span></div>
    <div class="hb" style="align-items:center"><span class="hl">POWER</span><span class="hv" id="hpw">NORMAL</span></div>
    <div class="hb" style="align-items:flex-end"><span class="hl">COINS</span><span class="hv" id="hco">0</span></div>
  </div>
  <div id="wrap">
    <canvas id="gc"></canvas>
    <div id="ov">
      <div class="logo">🌙 SUPER<br>SOLARIO</div>
      <div class="sub">TO THE MOON PLATFORMER</div>
      <div class="inf">
        <b>← →</b> MOVE &nbsp;·&nbsp; <b>SPACE / ↑</b> JUMP<br>
        Stomp <b style="color:#ef4444">BEARS</b> · Grab <b>$COINS</b> · Reach the 🚀 flag
      </div>
      <button class="btn" id="sb">🚀 LAUNCH TO THE MOON</button>
      <div class="hint">PRESS ENTER OR SPACE</div>
    </div>
    <div id="msg"></div>
  </div>
  <div id="mctrl">
    <div class="cg">
      <button class="cb" id="bl">◀</button>
      <button class="cb" id="br">▶</button>
    </div>
    <div class="cg">
      <button class="cb cj" id="bj">JUMP</button>
    </div>
  </div>
</div>
<script>
// ============================================================
//  SUPER SOLARIO BROS  —  Verified Full Engine
// ============================================================
const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('wrap');

// Canvas size
function resz(){
  const r=wrap.getBoundingClientRect();
  canvas.width=900;
  canvas.height=Math.max(280,Math.round(900*(r.height/r.width)));
}
resz();
window.addEventListener('resize',resz);
const CW=()=>canvas.width, CH=()=>canvas.height;

const T=32;   // tile size
const GRAV=0.52;
const MAX_FALL=13;
const ACCEL=0.55;
const FRICTION=0.78;
const AIR_ACCEL=0.28;
const AIR_FRICTION=0.92;

// ─── AUDIO (Web Audio beeps, no assets) ───────────────────
let AC=null;
function getAC(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  return AC;
}
function beep(freq,dur=.08,type='square',vol=.08,delay=0,slide=0){
  const ac=getAC(); if(!ac) return;
  const t0=ac.currentTime+delay;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t0+dur);
  g.gain.setValueAtTime(vol,t0);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t0); o.stop(t0+dur+0.02);
}
const sfx={
  jump:()=>{beep(280,.07,'square',.07);beep(420,.09,'square',.05,.04);},
  coin:()=>{beep(880,.06,'square',.06);beep(1320,.1,'square',.05,.05);},
  stomp:()=>{beep(160,.1,'triangle',.1,-40);},
  hurt:()=>{beep(220,.12,'sawtooth',.08);beep(110,.18,'sawtooth',.06,.06);},
  power:()=>{beep(440,.08,'square',.07);beep(660,.1,'square',.06,.07);beep(880,.14,'square',.05,.14);},
  clear:()=>{beep(523,.1,'square',.07);beep(659,.1,'square',.06,.1);beep(784,.18,'square',.07,.2);},
  die:()=>{beep(300,.15,'sawtooth',.08);beep(180,.25,'sawtooth',.07,.1,-120);},
  qhit:()=>{beep(200,.05,'triangle',.06);beep(500,.08,'square',.05,.04);}
};

// ─── INPUT ───────────────────────────────────────────────
const K={};
document.addEventListener('keydown',e=>{
  K[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if(AC&&AC.state==='suspended') AC.resume();
});
document.addEventListener('keyup',e=>{K[e.code]=false;});
document.addEventListener('pointerdown',()=>{const a=getAC(); if(a&&a.state==='suspended') a.resume();},{once:false});

function bp(k,el){K[k]=true;el.classList.add('on');}
function br2(k,el){K[k]=false;el.classList.remove('on');}
[['bl','L'],['br','R'],['bj','J']].forEach(([id,k])=>{
  const el=document.getElementById(id);
  ['touchstart','mousedown'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();bp(k,el);}));
  ['touchend','touchcancel','mouseup','mouseleave'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();br2(k,el);}));
});

const L=()=>K['ArrowLeft']||K['KeyA']||K['L'];
const R=()=>K['ArrowRight']||K['KeyD']||K['R'];
const JMP=()=>K['ArrowUp']||K['Space']||K['KeyW']||K['J'];

// ─── HUD ──────────────────────────────────────────────────
let score=0,lives=3,coins=0,lv=1;
const hsc=document.getElementById('hsc');
const hlv=document.getElementById('hlv');
const hlvl=document.getElementById('hlvl');
const hpw=document.getElementById('hpw');
const hco=document.getElementById('hco');
function updHUD(){
  hsc.textContent=score.toLocaleString();
  hlv.textContent='🌙'.repeat(Math.max(0,lives));
  hlvl.textContent=lv;
  hco.textContent=coins;
  hpw.textContent=PL?['NORMAL','SUPER','MOON'][PL.pl]||'?':'NORMAL';
}

// ─── MSG ──────────────────────────────────────────────────
let msgT=0;
function msg(t){const e=document.getElementById('msg');e.textContent=t;e.style.opacity='1';msgT=140;}

// ─── GAME STATE ───────────────────────────────────────────
let GS='idle'; // idle|play|dead|lc|over
let RAF=null,lastMs=0,FC=0;
let WLD=null,PL=null;
let parts=[],ftxts=[];
let camX=0,shX=0,shY=0,shTm=0;
function shake(m,f){shTm=f;shX=(Math.random()-.5)*m*2;shY=(Math.random()-.5)*m*2;}

// ─── PARTICLES ────────────────────────────────────────────
function spP(x,y,col,n,sp=1){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=(2+Math.random()*3)*sp;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2.5,life:1,dc:.022,col,r:2+Math.random()*2});
  }
}
function ftxt(x,y,t,c='#ffd700'){ftxts.push({x,y,vy:-1.4,t,c,life:1,dc:.016});}

// ─── LEVEL THEMES ─────────────────────────────────────────
/*
  4 hand-crafted themes with unique platforming layouts.
  Each level uses a deterministic seed-based layout so
  platforms, gaps, coins, enemies are placed intentionally.
*/
const THEMES=[
  // 1 – MOON DISTRICT
  {
    name:'🌙 MOON DISTRICT',
    skyT:'#05051a',skyB:'#0f0530',
    gfill:'#1a0545',gtop:'#6d28d9',
    bA:'#3b0764',bB:'#6d28d9',
    eCol:['#dc2626','#7f1d1d'],eName:'BEAR',
    stars:true,hasLava:false,bgMoon:true
  },
  // 2 – CRYPTO CITY
  {
    name:'🏙️ CRYPTO CITY',
    skyT:'#00111f',skyB:'#002a3a',
    gfill:'#041f12',gtop:'#059669',
    bA:'#022c1b',bB:'#047857',
    eCol:['#7c3aed','#4c1d95'],eName:'FUD',
    stars:false,hasLava:false,bgCity:true
  },
  // 3 – DIAMOND PEAKS
  {
    name:'💎 DIAMOND PEAKS',
    skyT:'#160200',skyB:'#3d0a00',
    gfill:'#3d0a00',gtop:'#ea580c',
    bA:'#431407',bB:'#9a3412',
    eCol:['#1d4ed8','#1e3a8a'],eName:'WHALE',
    stars:false,hasLava:true,bgVolc:true
  },
  // 4 – FINAL MOON
  {
    name:'🚀 TO THE MOON',
    skyT:'#000005',skyB:'#06060f',
    gfill:'#0a0a20',gtop:'#f7c948',
    bA:'#0c1a3a',bB:'#1d4ed8',
    eCol:['#ef4444','#991b1b'],eName:'RUGGER',
    stars:true,hasLava:false,bgSpace:true
  }
];

// ─── BACKGROUND STARS ─────────────────────────────────────
const BGSTARS=Array.from({length:160},()=>({
  x:Math.random()*4000,y:Math.random()*240,r:Math.random()*1.6+.2,
  tw:Math.random()*Math.PI*2,spd:Math.random()*.3+.05
}));

// ─── LEVEL BUILDER ────────────────────────────────────────
/*
  Levels are hand-authored via a simple tile-map DSL.
  Each level defines:
    - groundMap: array of column objects {x, gaps:[x indices to remove ground]}
    - platforms: explicit platform definitions
    - qBlocks: question block positions
    - enemies: enemy spawn data
  This guarantees playable, tested layouts.
*/

function buildLevel(n){
  const theme=THEMES[(n-1)%4];
  const gr=Math.floor(CH()/T)-3; // ground row index
  const GY=gr*T;                  // ground Y pixel

  // ── LEVEL LAYOUTS ──────────────────────────────────────
  // Each layout is an array of "instructions":
  // {type:'plat',x,y,w} | {type:'q',x,y,ct} | {type:'enemy',x,flying}
  // x,y in tile units; w in tiles
  // Shared coin rows are auto-generated above platforms/qblocks

  const layouts=[
    // ── LEVEL 1: MOON DISTRICT ────────────────────────────
    // Tutorial feel – wide platforms, no gaps, lots of coins
    {
      worldW:70,
      gaps:[],
      plats:[
        {x:5,y:gr-3,w:4},{x:10,y:gr-4,w:3},{x:15,y:gr-3,w:5},
        {x:22,y:gr-5,w:3},{x:26,y:gr-3,w:4},{x:31,y:gr-4,w:3},
        {x:36,y:gr-3,w:5},{x:42,y:gr-5,w:4},{x:47,y:gr-3,w:3},
        {x:52,y:gr-4,w:4},{x:57,y:gr-3,w:4},{x:62,y:gr-5,w:3},
      ],
      qBlocks:[
        {x:7,y:gr-6,ct:'coin'},{x:12,y:gr-7,ct:'shroom'},{x:17,y:gr-6,ct:'coin'},
        {x:24,y:gr-8,ct:'star'},{x:29,y:gr-6,ct:'coin'},{x:38,y:gr-6,ct:'shroom'},
        {x:44,y:gr-8,ct:'coin'},{x:49,y:gr-6,ct:'coin'},{x:54,y:gr-7,ct:'star'},
        {x:59,y:gr-6,ct:'coin'},
      ],
      enemies:[
        {x:22,fly:false},{x:38,fly:false},{x:52,fly:false},{x:64,fly:false},
      ],
      coinRows:[
        {x:5,y:gr-4,n:4},{x:10,y:gr-5,n:3},{x:15,y:gr-4,n:5},
        {x:22,y:gr-6,n:3},{x:36,y:gr-4,n:5},{x:42,y:gr-6,n:4},
        {x:52,y:gr-5,n:4},{x:57,y:gr-4,n:4},
      ]
    },
    // ── LEVEL 2: CRYPTO CITY ──────────────────────────────
    // Introduces gaps and flying enemies
    {
      worldW:80,
      gaps:[12,13,22,23,35,36,50,51,63,64],
      plats:[
        {x:5,y:gr-4,w:4},{x:10,y:gr-5,w:3},{x:15,y:gr-4,w:4},
        {x:18,y:gr-7,w:3},{x:25,y:gr-4,w:5},{x:30,y:gr-6,w:3},
        {x:33,y:gr-8,w:3,mov:true,mspd:0.8},{x:38,y:gr-4,w:5},
        {x:44,y:gr-6,w:3},{x:47,y:gr-4,w:4,mov:true,mspd:1.0},
        {x:53,y:gr-5,w:3},{x:56,y:gr-7,w:4},{x:60,y:gr-4,w:4},
        {x:66,y:gr-5,w:4},{x:71,y:gr-4,w:4},
      ],
      qBlocks:[
        {x:6,y:gr-7,ct:'coin'},{x:11,y:gr-8,ct:'shroom'},{x:16,y:gr-7,ct:'coin'},
        {x:19,y:gr-10,ct:'star'},{x:26,y:gr-7,ct:'coin'},{x:31,y:gr-9,ct:'shroom'},
        {x:39,y:gr-7,ct:'coin'},{x:45,y:gr-9,ct:'coin'},{x:57,y:gr-10,ct:'star'},
        {x:61,y:gr-7,ct:'coin'},{x:67,y:gr-8,ct:'coin'},{x:72,y:gr-7,ct:'shroom'},
      ],
      enemies:[
        {x:8,fly:false},{x:16,fly:false},{x:25,fly:false},
        {x:32,fly:true},{x:38,fly:false},{x:44,fly:true},
        {x:55,fly:false},{x:60,fly:true},{x:66,fly:false},{x:72,fly:false},
      ],
      coinRows:[
        {x:5,y:gr-5,n:4},{x:15,y:gr-5,n:4},{x:25,y:gr-5,n:5},
        {x:38,y:gr-5,n:5},{x:53,y:gr-6,n:3},{x:60,y:gr-5,n:4},{x:66,y:gr-6,n:4},
      ]
    },
    // ── LEVEL 3: DIAMOND PEAKS ────────────────────────────
    // Lava pits, bigger gaps, harder enemies, moving platforms
    {
      worldW:90,
      gaps:[10,11,12,20,21,30,31,32,42,43,55,56,67,68,69],
      plats:[
        {x:4,y:gr-4,w:4},{x:7,y:gr-7,w:3},{x:14,y:gr-5,w:4},
        {x:17,y:gr-8,w:3,mov:true,mspd:1.2},{x:23,y:gr-4,w:4},
        {x:27,y:gr-7,w:3},{x:29,y:gr-9,w:3,mov:true,mspd:0.9},
        {x:34,y:gr-5,w:4},{x:38,y:gr-8,w:3},{x:40,y:gr-11,w:3,mov:true,mspd:1.4},
        {x:45,y:gr-5,w:4},{x:49,y:gr-8,w:3,mov:true,mspd:1.1},
        {x:53,y:gr-5,w:4},{x:58,y:gr-7,w:4},{x:62,y:gr-9,w:3},
        {x:64,y:gr-12,w:3,mov:true,mspd:1.5},{x:71,y:gr-5,w:5},
        {x:76,y:gr-8,w:3},{x:80,y:gr-5,w:5},{x:84,y:gr-8,w:4},
      ],
      qBlocks:[
        {x:5,y:gr-7,ct:'coin'},{x:8,y:gr-10,ct:'shroom'},{x:15,y:gr-8,ct:'coin'},
        {x:24,y:gr-7,ct:'star'},{x:35,y:gr-8,ct:'coin'},{x:39,y:gr-11,ct:'shroom'},
        {x:46,y:gr-8,ct:'coin'},{x:54,y:gr-8,ct:'star'},{x:59,y:gr-10,ct:'coin'},
        {x:72,y:gr-8,ct:'coin'},{x:77,y:gr-11,ct:'shroom'},{x:81,y:gr-8,ct:'coin'},
        {x:85,y:gr-11,ct:'star'},
      ],
      enemies:[
        {x:7,fly:false},{x:14,fly:true},{x:23,fly:false},{x:29,fly:true},
        {x:35,fly:false},{x:40,fly:true},{x:46,fly:false},{x:53,fly:true},
        {x:59,fly:false},{x:65,fly:true},{x:72,fly:false},{x:78,fly:true},
        {x:82,fly:false},{x:86,fly:false},
      ],
      coinRows:[
        {x:4,y:gr-5,n:4},{x:14,y:gr-6,n:4},{x:23,y:gr-5,n:4},
        {x:34,y:gr-6,n:4},{x:45,y:gr-6,n:4},{x:53,y:gr-6,n:4},
        {x:71,y:gr-6,n:5},{x:80,y:gr-6,n:5},
      ]
    },
    // ── LEVEL 4: TO THE MOON ──────────────────────────────
    // Final boss-rush level – lots of enemies, tricky layout
    {
      worldW:100,
      gaps:[8,9,15,16,17,25,26,36,37,38,47,48,58,59,70,71,72,82,83],
      plats:[
        {x:3,y:gr-4,w:3},{x:6,y:gr-7,w:3},{x:11,y:gr-5,w:4},
        {x:14,y:gr-8,w:3,mov:true,mspd:1.3},{x:19,y:gr-4,w:4},
        {x:22,y:gr-8,w:3},{x:23,y:gr-11,w:3,mov:true,mspd:1.6},
        {x:28,y:gr-5,w:4},{x:32,y:gr-8,w:3,mov:true,mspd:1.4},
        {x:33,y:gr-11,w:3},{x:39,y:gr-5,w:4},{x:43,y:gr-9,w:3},
        {x:44,y:gr-12,w:3,mov:true,mspd:1.8},{x:49,y:gr-5,w:4},
        {x:53,y:gr-8,w:3,mov:true,mspd:1.5},{x:55,y:gr-12,w:3},
        {x:61,y:gr-5,w:4},{x:65,y:gr-9,w:3},{x:66,y:gr-13,w:3,mov:true,mspd:2.0},
        {x:73,y:gr-5,w:4},{x:77,y:gr-9,w:3,mov:true,mspd:1.7},
        {x:79,y:gr-13,w:3},{x:84,y:gr-5,w:4},{x:88,y:gr-8,w:4},
        {x:92,y:gr-5,w:4},{x:95,y:gr-8,w:4},
      ],
      qBlocks:[
        {x:4,y:gr-7,ct:'coin'},{x:7,y:gr-10,ct:'shroom'},{x:12,y:gr-8,ct:'star'},
        {x:15,y:gr-11,ct:'coin'},{x:20,y:gr-7,ct:'shroom'},{x:23,y:gr-11,ct:'coin'},
        {x:29,y:gr-8,ct:'star'},{x:33,y:gr-11,ct:'coin'},{x:40,y:gr-8,ct:'shroom'},
        {x:44,y:gr-12,ct:'coin'},{x:50,y:gr-8,ct:'star'},{x:53,y:gr-11,ct:'coin'},
        {x:62,y:gr-8,ct:'shroom'},{x:66,y:gr-13,ct:'coin'},{x:74,y:gr-8,ct:'star'},
        {x:77,y:gr-12,ct:'coin'},{x:85,y:gr-8,ct:'coin'},{x:89,y:gr-11,ct:'shroom'},
        {x:93,y:gr-8,ct:'star'},{x:96,y:gr-11,ct:'coin'},
      ],
      enemies:[
        {x:5,fly:false},{x:11,fly:true},{x:19,fly:false},{x:22,fly:true},
        {x:28,fly:false},{x:33,fly:true},{x:39,fly:false},{x:44,fly:true},
        {x:49,fly:false},{x:55,fly:true},{x:61,fly:false},{x:66,fly:true},
        {x:73,fly:false},{x:79,fly:true},{x:84,fly:false},{x:88,fly:true},
        {x:92,fly:false},{x:96,fly:false},
      ],
      coinRows:[
        {x:3,y:gr-5,n:3},{x:11,y:gr-6,n:4},{x:19,y:gr-5,n:4},
        {x:28,y:gr-6,n:4},{x:39,y:gr-6,n:4},{x:49,y:gr-6,n:4},
        {x:61,y:gr-6,n:4},{x:73,y:gr-6,n:4},{x:84,y:gr-6,n:4},{x:92,y:gr-6,n:4},
      ]
    }
  ];

  // Cycle layouts for levels beyond 4
  const layout=layouts[(n-1)%4];
  const WW=layout.worldW;

  const plats=[];
  const coinArr=[];
  const enemies=[];
  const powerups=[];

  // Ground – build full floor then cut gaps
  const gapSet=new Set(layout.gaps);
  for(let x=0;x<WW;x++){
    if(!gapSet.has(x)){
      plats.push({x:x*T,y:GY,w:T,h:CH()-GY,gt:true,tp:'ground'});
    }
  }

  // Floating platforms
  for(const p of layout.plats){
    const px=p.x*T, py=p.y*T, pw=p.w*T;
    const mov=!!p.mov;
    plats.push({x:px,y:py,w:pw,h:T,gt:false,tp:'brick',
      mov,mx:px,mr:mov?50+Math.random()*40:0,
      ms:mov?(p.mspd||1)*(Math.random()<.5?1:-1):0,mt:Math.random()*100});
  }

  // Question blocks
  for(const q of layout.qBlocks){
    plats.push({x:q.x*T,y:q.y*T,w:T,h:T,gt:false,tp:'q',ct:q.ct,hit:false,ha:0});
  }

  // Coin rows
  for(const cr of layout.coinRows){
    for(let i=0;i<cr.n;i++){
      coinArr.push({x:cr.x*T+i*T+T/2,y:cr.y*T,r:9,done:false,a:Math.random()*Math.PI*2});
    }
  }

  // Extra scattered coins between platforms
  for(const p of layout.plats){
    const cx=p.x*T+T/2, cy=(p.y-1)*T;
    coinArr.push({x:cx,y:cy,r:9,done:false,a:Math.random()*Math.PI*2});
  }

  // Enemies
  for(const e of layout.enemies){
    const ex=e.x*T, ey=e.fly?GY-T*3:GY-30;
    enemies.push({
      x:ex,y:ey,w:28,h:28,
      vx:(Math.random()<.5?-1:1)*(1.0+0.15*n),
      vy:0,alive:true,og:false,
      sqT:0,dir:1,wF:0,wT:0,
      fly:e.fly,fa:Math.random()*Math.PI*2,
      fAmp:24+Math.random()*16,baseY:ey,
      hp:n>=3?2:1
    });
  }

  // Loose powerups — skip ground clutter on level 1 (tutorial)
  if(n>1){
    const puPositions=[[10,gr-2,'shroom'],[30,gr-2,'star'],[50,gr-2,'shroom'],[70,gr-2,'star']];
    for(const [px,py,pt] of puPositions){
      if(px<WW){
        powerups.push({x:px*T,y:py*T,t:pt,vx:1.5,vy:0,og:false,done:false,a:0});
      }
    }
  }

  // Lava tiles (visual only for theme 3)
  const lava=[];
  if(theme.hasLava){
    for(const gx of layout.gaps){
      lava.push({x:gx*T,y:GY+4,w:T,h:12});
    }
  }

  // Flag
  const flagX=(WW-3)*T, flagY=(gr-6)*T;

  return {plats,coins:coinArr,enemies,powerups,lava,flagX,flagY,WW,gr,GY,theme};
}

// ─── PLAYER FACTORY ───────────────────────────────────────
function mkP(){
  return {
    x:2*T,y:WLD.GY-T*1.5,w:22,h:32,
    vx:0,vy:0,og:false,wog:false,
    facing:1,wF:0,wT:0,
    pl:0,    // power level 0=normal 1=super 2=moon
    pt:0,    // power timer (moon duration)
    inv:90,  // spawn i-frames
    jbuf:0,  // jump buffer
    coy:0,   // coyote frames
    land:0,  // landing squash frames
    jp:false // jump pressed this frame edge
  };
}

// ─── COLLISION ────────────────────────────────────────────
function rHit(ax,ay,aw,ah,bx,by,bw,bh){
  return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;
}

// Resolve player vs platforms
function resolveP(dt){
  // X
  PL.x+=PL.vx*dt;
  PL.x=Math.max(0,PL.x);
  for(const pl of WLD.plats){
    if(pl.tp==='q'&&pl.hit) continue; // hit q-blocks still solid
    if(rHit(PL.x,PL.y,PL.w,PL.h,pl.x,pl.y,pl.w,pl.h)){
      if(PL.vx>0)PL.x=pl.x-PL.w;
      else if(PL.vx<0)PL.x=pl.x+pl.w;
      PL.vx=0;
    }
  }
  // Y
  PL.vy+=GRAV*dt;
  PL.y+=PL.vy*dt;
  PL.og=false;
  for(const pl of WLD.plats){
    if(rHit(PL.x,PL.y,PL.w,PL.h,pl.x,pl.y,pl.w,pl.h)){
      if(PL.vy>0&&PL.y+PL.h-PL.vy*dt<=pl.y+6){
        PL.y=pl.y-PL.h;PL.vy=0;PL.og=true;
      }else if(PL.vy<0){
        PL.y=pl.y+pl.h;PL.vy=1.2;
        if(pl.tp==='q'&&!pl.hit){pl.hit=true;pl.ha=9;triggerQ(pl);}
      }
    }
  }
}

function triggerQ(pl){
  sfx.qhit();
  if(pl.ct==='coin'){score+=50;coins++;spP(pl.x+T/2,pl.y,'#ffd700',10);ftxt(pl.x+T/2,pl.y-8,'+50');sfx.coin();}
  else if(pl.ct==='shroom') dropPU(pl.x,pl.y-T,'shroom');
  else if(pl.ct==='star')   dropPU(pl.x,pl.y-T,'star');
  shake(3,8);updHUD();
}
function dropPU(x,y,t){WLD.powerups.push({x,y,t,vx:2,vy:-4,og:false,done:false,a:0});}

function resolvePU(pu,dt){
  if(pu.done) return;
  pu.vy+=GRAV*dt;pu.x+=pu.vx*dt;pu.y+=pu.vy*dt;
  pu.og=false;
  for(const pl of WLD.plats){
    if(rHit(pu.x,pu.y,16,16,pl.x,pl.y,pl.w,pl.h)){
      if(pu.vx>0){pu.x=pl.x-16;pu.vx*=-1;}
      else{pu.x=pl.x+pl.w;pu.vx*=-1;}
    }
  }
  for(const pl of WLD.plats){
    if(rHit(pu.x,pu.y,16,16,pl.x,pl.y,pl.w,pl.h)){
      if(pu.vy>0&&pu.y+16-pu.vy*dt<=pl.y+4){pu.y=pl.y-16;pu.vy=0;pu.og=true;}
      else{pu.y=pl.y+pl.h;pu.vy=1;}
    }
  }
  if(pu.t==='shroom') pu.vx=Math.sign(pu.vx)*1.4;
  if(pu.y>CH()+80) pu.done=true;
}

function resolveE(e,dt){
  if(e.fly){
    e.fa+=.028*dt;
    e.x+=e.vx*dt;
    e.y=e.baseY+Math.sin(e.fa)*e.fAmp;
    if(e.x<0||e.x>WLD.WW*T){e.vx*=-1;}
    e.dir=e.vx>0?1:-1;
    return;
  }
  e.vy+=GRAV*dt;e.x+=e.vx*dt;
  for(const pl of WLD.plats){
    if(rHit(e.x,e.y,e.w,e.h,pl.x,pl.y,pl.w,pl.h)){
      e.vx>0?e.x=pl.x-e.w:e.x=pl.x+pl.w;
      e.vx*=-1;
    }
  }
  e.y+=e.vy*dt;e.og=false;
  for(const pl of WLD.plats){
    if(rHit(e.x,e.y,e.w,e.h,pl.x,pl.y,pl.w,pl.h)){
      if(e.vy>0&&e.y+e.h-e.vy*dt<=pl.y+4){e.y=pl.y-e.h;e.vy=0;e.og=true;}
      else{e.y=pl.y+e.h;e.vy=1;}
    }
  }
  e.dir=e.vx>0?1:-1;
  // Turn at edges of ground
  if(e.og){
    const ex=e.x+(e.vx>0?e.w+2:-2);
    const ey=e.y+e.h+4;
    let hasFloor=false;
    for(const pl of WLD.plats){
      if(ex>=pl.x&&ex<pl.x+pl.w&&ey>=pl.y&&ey<=pl.y+T) {hasFloor=true;break;}
    }
    if(!hasFloor) e.vx*=-1;
  }
}

// ─── UPDATE ───────────────────────────────────────────────
function update(dt){
  if(GS!=='play') return;
  FC++;

  const spd=PL.pl===2?6.2:4.8;
  const want=L()?-spd:R()?spd:0;
  if(want!==0){
    const a=PL.og?ACCEL:AIR_ACCEL;
    PL.vx+=Math.sign(want-PL.vx)*Math.min(Math.abs(want-PL.vx),a*dt*spd);
    if((want>0&&PL.vx>want)||(want<0&&PL.vx<want)) PL.vx=want;
  }else{
    PL.vx*=Math.pow(PL.og?FRICTION:AIR_FRICTION,dt);
    if(Math.abs(PL.vx)<.08) PL.vx=0;
  }
  if(L()) PL.facing=-1;
  if(R()) PL.facing=1;

  // Coyote + jump buffer
  if(PL.og) PL.coy=12; else if(PL.coy>0) PL.coy--;
  if(JMP()) PL.jbuf=10; else if(PL.jbuf>0) PL.jbuf--;

  if(PL.jbuf>0&&PL.coy>0){
    PL.vy=PL.pl===2?-14.2:PL.pl===1?-12.8:-11.6;
    PL.og=false;PL.jbuf=0;PL.coy=0;
    spP(PL.x+PL.w/2,PL.y+PL.h,'#c4b5fd',7);
    sfx.jump();
  }
  // Short hop cut
  if(!JMP()&&PL.vy<-3.5) PL.vy*=Math.pow(0.55,dt*0.35);
  // Fall cap
  if(PL.vy>MAX_FALL) PL.vy=MAX_FALL;

  // Update moving platforms + rider carry
  for(const pl of WLD.plats){
    if(pl.mov){
      const prev=pl.x;
      pl.mt+=1;pl.x=pl.mx+Math.sin(pl.mt*pl.ms*.024)*pl.mr;
      pl.dx=pl.x-prev;
      if(PL.og&&rHit(PL.x,PL.y+1,PL.w,PL.h,pl.x-pl.dx,pl.y-2,pl.w,pl.h+4)){
        PL.x+=pl.dx;
      }
    }
    if(pl.ha>0) pl.ha--;
  }

  const wasGround=PL.og;
  resolveP(dt);
  if(PL.og&&!wasGround&&PL.vy>=0) PL.land=6;
  if(PL.land>0) PL.land--;

  if(PL.inv>0) PL.inv--;
  if(PL.pt>0){
    PL.pt--;
    if(PL.pt===60) msg('MOON MODE ENDING!');
    if(PL.pt<=0&&PL.pl===2){PL.pl=1;updHUD();msg('MOON MODE EXPIRED!');}
  }

  // Walk anim
  if(Math.abs(PL.vx)>.5&&PL.og){
    PL.wT+=Math.abs(PL.vx)*.22*dt;
    if(PL.wT>1){PL.wF=(PL.wF+1)%6;PL.wT=0;}
  }

  // Camera with velocity lookahead
  const tc=PL.x-CW()/3+PL.vx*10;
  const maxC=WLD.WW*T-CW();
  const target=Math.max(0,Math.min(tc,maxC));
  const catchUp=Math.abs(target-camX)>180?.35:.22;
  camX+=(target-camX)*catchUp*dt;

  if(shTm>0){shTm--;shX=(Math.random()-.5)*4;shY=(Math.random()-.5)*4;}
  else{shX=0;shY=0;}

  // Coins
  for(const c of WLD.coins){
    if(c.done) continue;
    c.a+=.065*dt;
    if(rHit(PL.x,PL.y,PL.w,PL.h,c.x-c.r,c.y-c.r,c.r*2,c.r*2)){
      c.done=true;score+=10;coins++;
      spP(c.x,c.y,'#ffd700',8);ftxt(c.x,c.y-10,'+10');
      sfx.coin();updHUD();
      if(coins>0&&coins%100===0){lives++;msg('🌙 100 COINS = EXTRA LIFE!');updHUD();}
    }
  }

  // Powerups
  for(const pu of WLD.powerups){
    if(pu.done) continue;
    resolvePU(pu,dt);pu.a+=.08*dt;
    if(rHit(PL.x,PL.y,PL.w,PL.h,pu.x,pu.y,16,16)){
      pu.done=true;sfx.power();
      if(pu.t==='shroom'){
        if(PL.pl<1){PL.pl=1;msg('💊 SUPER SOLARIO!');shake(4,10);}
        score+=200;ftxt(pu.x,pu.y-10,'+200 SUPER!','#22c55e');
      }else{
        PL.pl=2;PL.pt=540;msg('🌙 MOON MODE ACTIVATED!');shake(6,16);
        score+=500;ftxt(pu.x,pu.y-10,'+500 MOON!','#ffd700');
        spP(pu.x+8,pu.y+8,'#ffd700',22,1.5);
        spP(pu.x+8,pu.y+8,'#fff',10);
      }
      updHUD();
    }
  }

  // Enemies
  for(const e of WLD.enemies){
    if(!e.alive){if(e.sqT>0)e.sqT--;continue;}
    if(e.hitFlash>0) e.hitFlash--;
    resolveE(e,dt);
    e.wT=(e.wT||0)+.14*dt;e.wF=Math.floor(e.wT)%4;
    if(e.y>CH()+100){e.alive=false;continue;}

    if(PL.inv===0&&rHit(PL.x,PL.y,PL.w,PL.h,e.x,e.y,e.w,e.h)){
      if(PL.pl===2){
        e.alive=false;e.sqT=0;
        spP(e.x+e.w/2,e.y+e.h/2,'#ff6b00',14);
        spP(e.x+e.w/2,e.y+e.h/2,'#ef4444',8);
        score+=500;ftxt(e.x+e.w/2,e.y,'REKT +500','#ffd700');
        sfx.stomp();shake(3,5);updHUD();
      }else{
        const stomped=PL.vy>0.8&&(PL.y+PL.h)<(e.y+e.h*.62);
        if(stomped){
          e.hp--;PL.vy=-9.2;shake(2,5);sfx.stomp();
          if(e.hp<=0){
            e.alive=false;e.sqT=26;
            spP(e.x+e.w/2,e.y+e.h/2,'#ff6b00',12);
            score+=200;ftxt(e.x+e.w/2,e.y,'REKT +200','#ff6b00');
          }else{
            e.vx*=-1;e.hitFlash=18;ftxt(e.x+e.w/2,e.y,'HIT!','#fbbf24');
          }
          updHUD();
        }else{
          hurtP();
        }
      }
    }
  }

  // Lava
  if(WLD.lava){
    for(const lv of WLD.lava){
      if(rHit(PL.x,PL.y,PL.w,PL.h,lv.x,lv.y-4,lv.w,lv.h+8)){
        hurtP(true); break;
      }
    }
  }

  // Fall off map
  if(PL.y>CH()+80) hurtP(true);

  // Flag
  if(rHit(PL.x,PL.y,PL.w,PL.h,WLD.flagX,WLD.flagY,24,CH()-WLD.flagY)){
    winLevel();
  }

  // Update particles
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=GRAV*.3*dt;p.life-=p.dc*dt;
    if(p.life<=0) parts.splice(i,1);
  }
  for(let i=ftxts.length-1;i>=0;i--){
    const t=ftxts[i];t.y+=t.vy*dt;t.life-=t.dc*dt;
    if(t.life<=0) ftxts.splice(i,1);
  }
  if(msgT>0){msgT--;} else document.getElementById('msg').style.opacity='0';
}

function hurtP(fell=false){
  if(PL.inv>0) return;
  if(PL.pl>0&&!fell){
    PL.pl=Math.max(0,PL.pl-1);PL.inv=100;
    PL.vx=-PL.facing*5.5;PL.vy=-7;
    shake(5,14);sfx.hurt();
    msg('OUCH! HOLD DIAMOND HANDS!');
    spP(PL.x+PL.w/2,PL.y+PL.h/2,'#ef4444',16);
    updHUD();return;
  }
  lives--;updHUD();
  spP(PL.x+PL.w/2,PL.y+PL.h/2,'#ef4444',22,1.4);
  shake(9,20);sfx.die();
  if(lives<=0){GS='over';setTimeout(()=>showEnd('over'),700);}
  else{GS='dead';setTimeout(()=>{initLevel();GS='play';},1100);}
}

function winLevel(){
  score+=1200*lv;updHUD();GS='lc';sfx.clear();
  spP(WLD.flagX+12,WLD.flagY,'#ffd700',30,1.4);
  spP(WLD.flagX+12,WLD.flagY,'#00ff9d',18);
  setTimeout(()=>showEnd('lc'),900);
}

// ─── DRAW BACKGROUND ─────────────────────────────────────
function drawBG(){
  const TH=WLD.theme;
  const g=ctx.createLinearGradient(0,0,0,CH());
  g.addColorStop(0,TH.skyT);g.addColorStop(1,TH.skyB);
  ctx.fillStyle=g;ctx.fillRect(0,0,CW(),CH());

  // Stars
  if(TH.stars){
    for(const s of BGSTARS){
      const tw=.35+.65*Math.sin(FC*.035+s.tw);
      ctx.globalAlpha=tw*.85;ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc((s.x-camX*s.spd*.08)%CW(),s.y,s.r,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  // Big moon decoration
  if(TH.bgMoon){
    ctx.globalAlpha=.18;
    ctx.fillStyle='#ffe9a0';
    ctx.beginPath();ctx.arc(CW()*.75-camX*.02,60,55,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=.06;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(CW()*.75-camX*.02,60,68,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }

  // City silhouette
  if(TH.bgCity){
    ctx.fillStyle='#011a0a';
    const bldgs=[[50,120,60,80],[130,100,40,100],[200,140,55,60],[280,90,70,110],[370,120,50,80],[440,110,65,90],[520,130,55,70],[600,95,60,105],[680,120,50,80],[750,110,65,90]];
    for(const[bx,bh,bw,_] of bldgs){
      const sx=(bx-camX*.3)%CW()-20;
      ctx.fillRect(sx,CH()-bh,bw,bh);
      // windows
      ctx.fillStyle='rgba(255,220,100,.3)';
      for(let wy=CH()-bh+10;wy<CH()-10;wy+=14){
        for(let wx=sx+6;wx<sx+bw-8;wx+=10){
          if(Math.sin(wx+wy)>.2) ctx.fillRect(wx,wy,5,7);
        }
      }
      ctx.fillStyle='#011a0a';
    }
    ctx.globalAlpha=1;
  }

  // Volcano silhouette
  if(TH.bgVolc){
    ctx.fillStyle='#1a0500';
    const peaks=[[0,CH()],[80,CH()-100],[160,CH()],[240,CH()-160],[320,CH()],[400,CH()-130],[480,CH()],[560,CH()-90],[640,CH()],[720,CH()-140],[800,CH()]];
    for(let i=0;i<peaks.length-1;i++){
      const px=(peaks[i][0]-camX*.2)%CW();
      const ph=peaks[i][1];
      const nx=(peaks[i+1][0]-camX*.2)%CW();
      const nh=peaks[i+1][1];
      ctx.beginPath();ctx.moveTo(px,CH());ctx.lineTo(px,ph);ctx.lineTo(nx,nh);ctx.lineTo(nx,CH());ctx.closePath();ctx.fill();
    }
    // Lava glow
    ctx.fillStyle='rgba(220,80,0,.12)';ctx.fillRect(0,CH()-20,CW(),20);
    ctx.globalAlpha=1;
  }

  // Space nebula
  if(TH.bgSpace){
    ctx.globalAlpha=.07;
    const nebula=ctx.createRadialGradient(CW()*.3-camX*.01,CH()*.4,10,CW()*.3-camX*.01,CH()*.4,180);
    nebula.addColorStop(0,'#4f46e5');nebula.addColorStop(1,'transparent');
    ctx.fillStyle=nebula;ctx.fillRect(0,0,CW(),CH());
    const nebula2=ctx.createRadialGradient(CW()*.7-camX*.01,CH()*.3,10,CW()*.7-camX*.01,CH()*.3,150);
    nebula2.addColorStop(0,'#0891b2');nebula2.addColorStop(1,'transparent');
    ctx.fillStyle=nebula2;ctx.fillRect(0,0,CW(),CH());
    ctx.globalAlpha=1;
  }
}

// ─── DRAW PLATFORMS ───────────────────────────────────────
function drawPlat(pl){
  const TH=WLD.theme;
  const sx=pl.x-camX;
  if(sx>CW()+64||sx+pl.w<-64) return;

  if(pl.tp==='ground'){
    ctx.fillStyle=TH.gfill;ctx.fillRect(sx,pl.y+T,pl.w,pl.h);
    ctx.fillStyle=TH.gtop;ctx.fillRect(sx,pl.y,pl.w,T);
    ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(sx,pl.y,pl.w,4);
    // Grass tufts
    ctx.fillStyle=TH.gtop;
    for(let i=0;i<pl.w;i+=T){
      ctx.fillRect(sx+i+4,pl.y-4,5,5);
      ctx.fillRect(sx+i+12,pl.y-3,4,4);
      ctx.fillRect(sx+i+22,pl.y-5,5,5);
    }
  }else if(pl.tp==='brick'){
    // Top highlight + body + bottom shadow for depth
    ctx.fillStyle=TH.bA;ctx.fillRect(sx,pl.y,pl.w,pl.h);
    ctx.fillStyle=TH.bB;
    const bw=Math.max(T,pl.w/Math.round(pl.w/T));
    for(let b=0;b<pl.w;b+=bw){
      ctx.fillRect(sx+b+2,pl.y+2,bw-4,T/2-3);
      ctx.fillRect(sx+b+2,pl.y+T/2+1,bw-4,T/2-3);
    }
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(sx,pl.y,pl.w,3);
    ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(sx,pl.y+pl.h-3,pl.w,3);
    ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1;ctx.strokeRect(sx+.5,pl.y+.5,pl.w-1,pl.h-1);
    if(pl.mov){
      ctx.fillStyle='rgba(255,230,100,.18)';ctx.fillRect(sx,pl.y,pl.w,pl.h);
      ctx.fillStyle='#f7c948';ctx.fillRect(sx,pl.y,pl.w,2);
      ctx.fillRect(sx+pl.w/2-6,pl.y+pl.h-5,12,2);
    }
  }else if(pl.tp==='q'){
    const bob=pl.ha>0?-pl.ha*.45:0;
    if(pl.hit){
      ctx.fillStyle='#4b4b5a';ctx.fillRect(sx,pl.y+bob,T,T);
      ctx.fillStyle='#666';ctx.fillRect(sx+2,pl.y+bob+2,T-4,T-4);
      ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1;ctx.strokeRect(sx,pl.y+bob,T,T);
    }else{
      ctx.fillStyle='#f59e0b';ctx.fillRect(sx,pl.y+bob,T,T);
      ctx.fillStyle='#fcd34d';ctx.fillRect(sx+2,pl.y+bob+2,T-4,T-4);
      ctx.shadowColor='#f59e0b';ctx.shadowBlur=10+Math.sin(FC*.09)*4;
      ctx.strokeStyle='#fb923c';ctx.lineWidth=2;ctx.strokeRect(sx+1,pl.y+bob+1,T-2,T-2);
      ctx.shadowBlur=0;
      ctx.fillStyle='#78350f';ctx.font=`bold 13px 'Press Start 2P'`;
      ctx.textAlign='center';ctx.fillText('$',sx+T/2,pl.y+bob+T-8);ctx.textAlign='left';
    }
  }
}

// ─── DRAW LAVA ────────────────────────────────────────────
function drawLava(){
  if(!WLD.lava) return;
  for(const lv of WLD.lava){
    const sx=lv.x-camX;
    if(sx>CW()+T||sx+lv.w<-T) continue;
    const pulse=Math.sin(FC*.08)*3;
    const lg=ctx.createLinearGradient(0,lv.y,0,lv.y+lv.h);
    lg.addColorStop(0,'#ff4500');lg.addColorStop(1,'#b91c1c');
    ctx.fillStyle=lg;ctx.fillRect(sx,lv.y+pulse,lv.w,lv.h);
    ctx.fillStyle='rgba(255,120,0,.5)';
    for(let i=0;i<lv.w;i+=8){
      const bh=2+Math.sin(FC*.1+i)*.5*3;
      ctx.fillRect(sx+i,lv.y+pulse-bh,6,bh);
    }
  }
}

// ─── DRAW COIN ────────────────────────────────────────────
function drawCoin(c){
  if(c.done) return;
  const sx=c.x-camX;
  if(sx<-20||sx>CW()+20) return;
  const scX=Math.abs(Math.cos(c.a*1.3))*.8+.2;
  const bob=Math.sin(c.a)*2.5;
  ctx.save();ctx.translate(sx,c.y+bob);
  ctx.shadowColor='#ffd700';ctx.shadowBlur=7;
  ctx.fillStyle='#ffd700';
  ctx.beginPath();ctx.ellipse(0,0,c.r*scX,c.r,0,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,200,.7)';
  ctx.beginPath();ctx.ellipse(-c.r*.18*scX,-c.r*.18,c.r*.3*scX,c.r*.27,0,0,Math.PI*2);ctx.fill();
  if(scX>.45){
    ctx.fillStyle='#92400e';ctx.font=`bold 6px 'Press Start 2P'`;
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',0,1);
  }
  ctx.restore();
}

// ─── DRAW ENEMY ───────────────────────────────────────────
function drawEnemy(e){
  if(!e.alive&&e.sqT<=0) return;
  const TH=WLD.theme;
  const sx=e.x-camX;
  if(sx<-60||sx>CW()+60) return;
  const sqH=e.alive?1:.22;
  const ey2=e.alive?e.y:e.y+e.h*(1-sqH);
  ctx.save();ctx.translate(sx+e.w/2,ey2+e.h*sqH/2);ctx.scale(e.dir,sqH);
  // Shadow
  ctx.globalAlpha=.18;ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(0,e.h*sqH*.5+3,e.w*.38,5,0,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
  if(e.hitFlash>0&&Math.floor(FC/2)%2===0){ctx.globalAlpha=.45;}
  // Body
  const gr=ctx.createRadialGradient(-3,-4,2,0,0,e.w*.5);
  gr.addColorStop(0,TH.eCol[0]);gr.addColorStop(1,TH.eCol[1]);
  ctx.fillStyle=gr;
  ctx.beginPath();ctx.ellipse(0,0,e.w*.5,e.h*sqH*.5,0,0,Math.PI*2);ctx.fill();
  if(e.alive){
    if(e.fly){
      ctx.fillStyle='rgba(255,255,255,.45)';
      const wf=Math.sin(FC*.22)*15;
      ctx.beginPath();ctx.ellipse(-e.w*.58,wf*.04-5,e.w*.32,7,Math.PI*.2,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(e.w*.58,wf*.04-5,e.w*.32,7,-Math.PI*.2,0,Math.PI*2);ctx.fill();
    }
    // Horns for tougher look
    ctx.fillStyle=TH.eCol[1];
    ctx.beginPath();ctx.moveTo(-10,-e.h*sqH*.42);ctx.lineTo(-14,-e.h*sqH*.7);ctx.lineTo(-4,-e.h*sqH*.45);ctx.fill();
    ctx.beginPath();ctx.moveTo(10,-e.h*sqH*.42);ctx.lineTo(14,-e.h*sqH*.7);ctx.lineTo(4,-e.h*sqH*.45);ctx.fill();
    // Eyes
    ctx.fillStyle='#fff';ctx.fillRect(-9,-8,7,7);ctx.fillRect(2,-8,7,7);
    ctx.fillStyle='#111';ctx.fillRect(-7,-6,4,4);ctx.fillRect(3,-6,4,4);
    // Angry brows
    ctx.fillStyle=TH.eCol[1];ctx.fillRect(-11,-12,9,3);ctx.fillRect(2,-12,9,3);
    // Feet
    const ft=Math.sin(FC*.28)*3;
    ctx.fillStyle=TH.eCol[1];ctx.fillRect(-9,e.h*sqH*.35,7,6+ft);ctx.fillRect(2,e.h*sqH*.35,7,6-ft);
    // HP pips
    if(e.hp>=2){ctx.fillStyle='#ffd700';ctx.fillRect(-7,-e.h*.68,5,3);ctx.fillRect(2,-e.h*.68,5,3);}
    else if(e.hp===1){ctx.fillStyle='#ffd700';ctx.fillRect(-3,-e.h*.68,5,3);}
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

// ─── DRAW POWERUP ─────────────────────────────────────────
function drawPU(pu){
  if(pu.done) return;
  const sx=pu.x-camX;
  if(sx<-30||sx>CW()+30) return;
  ctx.save();ctx.translate(sx+8,pu.y+8);
  if(pu.t==='shroom'){
    ctx.shadowColor='#22c55e';ctx.shadowBlur=10;
    ctx.fillStyle='#dc2626';ctx.beginPath();ctx.arc(0,-3,9,Math.PI,0);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-4,-5,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(3,-4,2.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fef3c7';ctx.fillRect(-5,0,10,9);
    ctx.fillStyle='#92400e';ctx.fillRect(-3,1,6,2);ctx.fillRect(-3,5,6,2);
    ctx.shadowBlur=0;
  }else{
    const a=pu.a;ctx.rotate(a);ctx.shadowColor='#ffd700';ctx.shadowBlur=15;
    ctx.fillStyle='#ffd700';
    for(let i=0;i<5;i++){
      ctx.save();ctx.rotate(i*Math.PI*2/5-Math.PI/2);
      ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(2,-3);ctx.lineTo(10,-3);ctx.lineTo(4,2);ctx.lineTo(6,10);
      ctx.lineTo(0,5);ctx.lineTo(-6,10);ctx.lineTo(-4,2);ctx.lineTo(-10,-3);ctx.lineTo(-2,-3);ctx.closePath();ctx.fill();
      ctx.restore();
    }
    ctx.shadowBlur=0;
  }
  ctx.restore();
}

// ─── DRAW FLAG ────────────────────────────────────────────
function drawFlag(){
  const sx=WLD.flagX-camX;
  if(sx>CW()+50||sx<-50) return;
  // pole
  ctx.fillStyle='#d1d5db';ctx.fillRect(sx+8,WLD.flagY,4,CH()-WLD.flagY);
  // flag
  ctx.shadowColor='#00ff9d';ctx.shadowBlur=14;
  ctx.fillStyle='#00ff9d';
  ctx.beginPath();ctx.moveTo(sx+12,WLD.flagY);ctx.lineTo(sx+48,WLD.flagY+24);ctx.lineTo(sx+12,WLD.flagY+48);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  ctx.font='18px sans-serif';ctx.textAlign='center';ctx.fillText('🚀',sx+32,WLD.flagY+28);ctx.textAlign='left';
}

// ─── DRAW PLAYER ──────────────────────────────────────────
function drawPlayer(){
  if(!PL) return;
  if(PL.inv>0&&Math.floor(FC/3)%2===0) return;
  const moon=PL.pl===2,sup=PL.pl>=1;
  const ht=sup?PL.h:PL.h*.78;
  const yt=PL.y+(PL.h-ht);
  const squash=PL.land>0?0.82+PL.land*0.03:(!PL.og?0.92:1);
  const stretch=PL.land>0?1.12:(!PL.og?1.08:1);
  const sx=PL.x+PL.w/2-camX,sy=yt+ht/2;
  ctx.save();ctx.translate(sx,sy);ctx.scale(PL.facing*stretch,squash);
  if(moon){ctx.shadowColor='#ffd700';ctx.shadowBlur=18+Math.sin(FC*.11)*6;}
  ctx.globalAlpha=.22;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(0,ht/2+5,PL.w*.42,5,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  const lg=PL.og?Math.sin(PL.wF*Math.PI/3)*7:(PL.vy<0?-2:4);
  ctx.fillStyle=moon?'#fbbf24':'#1d4ed8';ctx.fillRect(-9,ht/4+2,8,8+lg);ctx.fillRect(2,ht/4+2,8,8-lg);
  ctx.fillStyle=moon?'#f59e0b':'#1e1b4b';ctx.fillRect(-11,ht/4+8+lg,10,5);ctx.fillRect(2,ht/4+8-lg,10,5);
  ctx.fillStyle=moon?'#f59e0b':'#1d4ed8';ctx.fillRect(-PL.w/2+2,-1,PL.w-4,ht/4+5);
  ctx.fillStyle=moon?'#fbbf24':'#1e40af';ctx.fillRect(-5,-ht/4,3,ht/4+2);ctx.fillRect(3,-ht/4,3,ht/4+2);
  ctx.fillStyle=moon?'#fbbf24':'#dc2626';ctx.fillRect(-PL.w/2+2,-ht/2+ht/4+2,PL.w-4,ht/2-4);
  ctx.fillStyle=moon?'#fbbf24':'#dc2626';
  const arm=PL.og?Math.sin(PL.wF*Math.PI/3)*4:-6;
  ctx.fillRect(-PL.w/2-2,-ht/6,6,10+arm);ctx.fillRect(PL.w/2-4,-ht/6,6,10-arm);
  ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.ellipse(0,-ht/2+ht/5+1,PL.w/2-1,ht/5+3,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#78350f';ctx.fillRect(-6,-ht/2+ht/5+5,12,3);
  ctx.beginPath();ctx.arc(-3,-ht/2+ht/5+7,3.5,0,Math.PI);ctx.fill();
  ctx.beginPath();ctx.arc(3,-ht/2+ht/5+7,3.5,0,Math.PI);ctx.fill();
  ctx.fillStyle='#111';ctx.fillRect(-8,-ht/2+ht/5-2,5,5);ctx.fillRect(3,-ht/2+ht/5-2,5,5);
  ctx.fillStyle='#fff';ctx.fillRect(-6,-ht/2+ht/5-2,2,2);ctx.fillRect(5,-ht/2+ht/5-2,2,2);
  ctx.fillStyle=moon?'#f59e0b':'#dc2626';
  ctx.fillRect(-PL.w/2+1,-ht/2-5,PL.w-2,8);
  ctx.fillRect(-PL.w/2+5,-ht/2-14,PL.w-10,10);
  ctx.fillStyle=moon?'#000':'rgba(255,255,255,.9)';
  ctx.font=`5px 'Press Start 2P'`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('$',0,-ht/2-10);
  if(moon){
    const pulse=.18+Math.sin(FC*.1)*.08;
    ctx.globalAlpha=pulse;ctx.fillStyle='#ffd700';
    ctx.beginPath();ctx.ellipse(0,0,PL.w*.9,ht*.75,0,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.shadowBlur=0;ctx.restore();
}

// ─── DRAW PARTICLES ───────────────────────────────────────
function drawParts(){
  for(const p of parts){
    ctx.globalAlpha=p.life;ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x-camX,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawFTexts(){
  ctx.save();ctx.textAlign='center';
  for(const t of ftxts){
    ctx.globalAlpha=t.life;ctx.fillStyle=t.c;
    ctx.font=`6px 'Press Start 2P'`;ctx.fillText(t.t,t.x-camX,t.y);
  }
  ctx.globalAlpha=1;ctx.textAlign='left';ctx.restore();
}

// ─── RENDER ───────────────────────────────────────────────
function render(){
  ctx.clearRect(0,0,CW(),CH());
  if(!WLD) return;
  ctx.save();
  ctx.translate(shX,shY);
  drawBG();
  for(const pl of WLD.plats) drawPlat(pl);
  drawLava();
  drawFlag();
  for(const c of WLD.coins) drawCoin(c);
  for(const pu of WLD.powerups) drawPU(pu);
  for(const e of WLD.enemies) drawEnemy(e);
  drawPlayer();
  drawParts();
  drawFTexts();
  ctx.restore();
  // Scanline retro overlay
  ctx.fillStyle='rgba(0,0,0,.032)';
  for(let y=0;y<CH();y+=4) ctx.fillRect(0,y,CW(),2);
  // Level name watermark (first 3 seconds)
  if(FC<180){
    ctx.globalAlpha=Math.max(0,1-FC/150)*.6;
    ctx.fillStyle='#f7c948';ctx.font=`8px 'Press Start 2P'`;
    ctx.textAlign='center';ctx.fillText(WLD.theme.name,CW()/2,CH()/2-20);
    ctx.globalAlpha=1;ctx.textAlign='left';
  }
}

// ─── GAME LOOP ────────────────────────────────────────────
function loop(t){
  const dt=Math.min((t-lastMs)/16.67,3);
  lastMs=t;
  update(dt);
  render();
  RAF=requestAnimationFrame(loop);
}

// ─── INIT ─────────────────────────────────────────────────
function initLevel(){
  WLD=buildLevel(lv);
  PL=mkP();
  parts=[];ftxts=[];camX=0;FC=0;
  updHUD();
}

function startGame(){
  score=0;lives=3;coins=0;lv=1;
  document.getElementById('ov').style.display='none';
  initLevel();GS='play';
  if(RAF) cancelAnimationFrame(RAF);
  lastMs=performance.now();
  RAF=requestAnimationFrame(loop);
}

function showEnd(type){
  const ov=document.getElementById('ov');
  ov.style.display='flex';
  if(type==='over'){
    ov.innerHTML=`
      <div class="logo" style="font-size:clamp(14px,3.5vw,24px)">💀 REKT!<br><span style="font-size:.65em">PAPER HANDS</span></div>
      <div class="sc">$SOLARIO EARNED<br>🌙<br>${score.toLocaleString()}</div>
      <div class="inf" style="color:#f87171">The bears have won this time...<br>But a true holder never gives up.</div>
      <button class="btn" id="sb">🔄 DIAMOND RETRY</button>
      <div class="hint">PRESS ENTER</div>`;
    document.getElementById('sb').onclick=startGame;
  }else{
    lv++;
    const next=THEMES[(lv-1)%4];
    ov.innerHTML=`
      <div class="logo" style="font-size:clamp(14px,3.5vw,26px)">🚀 LEVEL ${lv-1}<br><span style="font-size:.65em">CLEARED!</span></div>
      <div class="sc">+${(1200*(lv-1)).toLocaleString()} $SOLARIO<br>Total: ${score.toLocaleString()}</div>
      <div class="inf">Next: ${next.name}<br>More bears. Bigger gains. More moon.</div>
      <button class="btn" id="sb">▶ NEXT LEVEL</button>
      <div class="hint">PRESS ENTER</div>`;
    document.getElementById('sb').onclick=()=>{
      ov.style.display='none';
      initLevel();GS='play';
    };
  }
}

// ─── START IDLE RENDER ────────────────────────────────────
document.getElementById('sb').onclick=startGame;
document.addEventListener('keydown',e=>{
  if(e.code!=='Enter'&&e.code!=='Space') return;
  if(GS==='idle'){ e.preventDefault(); startGame(); return; }
  if(GS==='over'){ e.preventDefault(); startGame(); return; }
  if(GS==='lc'){
    e.preventDefault();
    const ov=document.getElementById('ov');
    ov.style.display='none';
    initLevel();GS='play';
  }
});

// Animated title screen background
(function idleLoop(t){
  lastMs=t;
  ctx.clearRect(0,0,CW(),CH());
  const g=ctx.createLinearGradient(0,0,0,CH());
  g.addColorStop(0,'#05051a');g.addColorStop(1,'#0f0530');
  ctx.fillStyle=g;ctx.fillRect(0,0,CW(),CH());
  const fc=t*.001;
  for(const s of BGSTARS){
    const tw=.3+.7*Math.sin(fc*3+s.tw);
    ctx.globalAlpha=tw*.85;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(s.x%CW(),s.y%(CH()*.65+40),s.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=.14;ctx.fillStyle='#ffe9a0';
  ctx.beginPath();ctx.arc(CW()*.72,55,50,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
  if(GS==='idle') RAF=requestAnimationFrame(idleLoop);
})(performance.now());
</script>
